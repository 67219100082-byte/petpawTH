}

<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const userMenu = document.getElementById("userMenu");
const sidebarUserMenu = document.getElementById("sidebarUserMenu");

onAuthStateChanged(auth, async(user)=>{

    if(user){

        const snap = await getDoc(doc(db,"users",user.uid));

        let username="User";
        let photo="img/default-profile.png";

        if(snap.exists()){
            username=snap.data().username || "User";
            photo=snap.data().profile || "img/default-profile.png";
        }

        // Desktop
        userMenu.innerHTML=`
        <div class="user-dropdown">

            <div class="user-profile" id="profileBtn">

                <img src="${photo}">
                <span>${username}</span>

            </div>

            <div class="dropdown-menu" id="dropdownMenu">

                <a href="profile.html">โปรไฟล์</a>

                <a href="#" id="logoutBtn">ออกจากระบบ</a>

            </div>

        </div>
        `;

        // Mobile
        sidebarUserMenu.className="";
        sidebarUserMenu.innerHTML=`

<div class="sidebar-user">

<img src="${photo}">

<div>

<div class="sidebar-name">
${username}
</div>

<a href="profile.html">
โปรไฟล์
</a>

<br>

<a href="#" id="sidebarLogout">
ออกจากระบบ
</a>

</div>

</div>

`;

        document.getElementById("profileBtn").onclick=()=>{
            document
            .getElementById("dropdownMenu")
            .classList.toggle("show");
        };

        document.getElementById("logoutBtn").onclick=async()=>{
            await signOut(auth);
            location.reload();
        };

        document.getElementById("sidebarLogout").onclick=async()=>{
            await signOut(auth);
            location.reload();
        };

    }else{

        userMenu.innerHTML=`

<a href="register.html" class="menu-btn">
ลงทะเบียน
</a>

<a href="login.html" class="menu-btn">
เข้าสู่ระบบ
</a>

`;

        sidebarUserMenu.className="sidebar-buttons";

        sidebarUserMenu.innerHTML=`

<a href="register.html" class="register-btn">
ลงทะเบียน
</a>

<a href="login.html" class="login-btn">
เข้าสู่ระบบ
</a>

`;

    }

});
const chatBtn = document.getElementById("chatBtn");
const chatPopup = document.getElementById("chatPopup");
const closeChat = document.getElementById("closeChat");

chatBtn.onclick = () => {

    chatPopup.classList.add("show");

    chatBtn.style.display = "none";

};

closeChat.onclick = () => {

    chatPopup.classList.remove("show");

    chatBtn.style.display = "flex";

};
</script>
