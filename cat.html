<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>หาบ้านแมวจรจัด | PetPaw</title>


<!-- =========================================================
     GOOGLE FONT
========================================================= -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Prompt", sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f3f3f3;
    min-height:2000px;
    color:#333;
}

body.no-scroll{
    overflow:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
select{
    font-family:"Prompt", sans-serif;
}


/* =========================================================
   PAGE LOADER
========================================================= */

#pageLoader{

    position:fixed;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:14px;

    background:rgba(255,255,255,.35);

    backdrop-filter:blur(2px);

    z-index:999999;

    opacity:1;

    visibility:visible;

    transition:
        opacity .4s ease,
        visibility .4s ease;
}

#pageLoader.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.loader-spinner{

    width:55px;

    height:55px;

    border:5px solid #eadfce;

    border-top:5px solid #8a6847;

    border-radius:50%;

    animation:
        loaderSpin .8s linear infinite;
}

.loader-text{

    color:#8a6847;

    font-size:18px;

    font-weight:600;
}

@keyframes loaderSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   FILTER
========================================================= */

.filter-section{

    width:90%;

    max-width:1500px;

    margin:40px auto 20px;
}

.filter-box{

    display:flex;

    justify-content:flex-end;

    align-items:center;

    gap:15px;
}

.filter-box label{

    font-size:17px;

    font-weight:600;

    color:#555;
}

.filter-box select{

    width:260px;

    height:50px;

    border-radius:14px;

    border:2px solid #ddd;

    padding:0 15px;

    font-size:16px;

    outline:none;

    background:#fff;

    cursor:pointer;

    transition:.25s;
}

.filter-box select:focus{

    border-color:#c8a77c;

    box-shadow:
        0 0 0 3px rgba(200,167,124,.15);
}


/* =========================================================
   CAT SECTION
========================================================= */

.dog-section{

    width:90%;

    max-width:1500px;

    margin:35px auto 0;

    padding-bottom:180px;
}


/* =========================================================
   CARD CONTAINER
========================================================= */

.dog-container{

    display:grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap:22px;

    align-items:start;
}


/* =========================================================
   CAT CARD
========================================================= */

.dog-card{

    background:#fff;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 5px 18px rgba(0,0,0,.08);

    transition:
        transform .25s ease,
        box-shadow .25s ease;

    min-width:0;
}

.dog-card:hover{

    transform:translateY(-5px);

    box-shadow:
        0 12px 30px rgba(0,0,0,.13);
}


/* =========================================================
   IMAGE AREA
========================================================= */

.image-wrapper{

    position:relative;

    width:100%;

    height:240px;

    overflow:hidden;

    background:#eee;
}

.dog-image{

    display:block;

    width:100%;

    height:100%;

    object-fit:cover;

    cursor:zoom-in;

    transition:
        transform .35s ease,
        filter .25s ease;
}

.dog-card:hover .dog-image{

    transform:scale(1.025);

    filter:brightness(.96);
}


/* =========================================================
   IMAGE ZOOM BUTTON
========================================================= */

.image-zoom-btn{

    position:absolute;

    right:12px;

    bottom:12px;

    width:40px;

    height:40px;

    border:none;

    border-radius:50%;

    background:rgba(55,55,55,.9);

    color:#63c8ff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:20px;

    cursor:pointer;

    box-shadow:
        0 3px 10px rgba(0,0,0,.25);

    transition:.25s;

    z-index:2;
}

.image-zoom-btn:hover{

    transform:scale(1.08);

    background:#444;
}


/* =========================================================
   CARD CONTENT
========================================================= */

.dog-content{

    padding:18px 17px 16px;
}


/* =========================================================
   CARD HEADER
========================================================= */

.dog-header{

    display:block;

    margin-bottom:12px;
}


/* =========================================================
   NAME + STATUS
========================================================= */

.name-status-row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;
}

.dog-name{

    flex:1;

    min-width:0;

    font-size:21px;

    font-weight:700;

    color:#292929;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.adoption-status{

    flex-shrink:0;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:6px 11px;

    border-radius:18px;

    font-size:13px;

    font-weight:600;

    white-space:nowrap;
}


/* =========================================================
   STATUS AVAILABLE
========================================================= */

.adoption-status.available{

    background:#e7f7e9;

    color:#2e8b36;
}


/* =========================================================
   STATUS ADOPTED
========================================================= */

.adoption-status.adopted{

    background:#dbeafe;

    color:#1565c0;
}


/* =========================================================
   GENDER
========================================================= */

.gender-text{

    margin-top:2px;

    color:#777;

    font-size:14px;

    font-weight:400;
}


/* =========================================================
   INFORMATION GRID
========================================================= */

.info-grid{

    display:grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:7px;

    margin-top:14px;
}


/* =========================================================
   INFORMATION ITEM
========================================================= */

.info-item{

    min-width:0;

    min-height:54px;

    padding:8px 10px;

    background:#f7f7f7;

    border-radius:12px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    overflow:hidden;
}


/* =========================================================
   INFO LABEL
========================================================= */

.info-label{

    width:auto;

    font-size:11px;

    line-height:1.3;

    color:#999;

    font-weight:400;

    margin-bottom:2px;
}


/* =========================================================
   INFO VALUE
========================================================= */

.info-value{

    flex:initial;

    min-width:0;

    color:#333;

    font-size:13px;

    font-weight:600;

    line-height:1.35;

    word-break:break-word;

    overflow-wrap:anywhere;
}


/* =========================================================
   LOCATION
========================================================= */

.location-box{

    display:flex;

    align-items:flex-start;

    gap:9px;

    margin-top:10px;

    padding:10px 12px;

    background:#f7f2eb;

    border-radius:12px;

    color:#735b42;

    font-size:13px;

    line-height:1.55;

    min-height:43px;
}

.location-icon{

    flex-shrink:0;

    font-size:15px;

    line-height:1.4;
}

.location-text{

    min-width:0;

    word-break:break-word;
}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-title{

    margin-top:12px;

    margin-bottom:8px;

    font-size:14px;

    font-weight:700;

    color:#7b6249;
}


/* =========================================================
   DETAIL
========================================================= */

.detail{

    background:#fafafa;

    padding:12px;

    border-radius:12px;

    line-height:1.65;

    color:#666;

    font-size:13px;

    min-height:60px;

    word-break:break-word;

    overflow-wrap:anywhere;
}


/* =========================================================
   DIVIDER
========================================================= */

.section-divider{

    border:0;

    border-top:
        1px solid #e5e5e5;

    margin:13px 0 10px;
}


/* =========================================================
   OWNER
========================================================= */

.owner-box{

    display:block;

    padding:0;

    border-radius:12px;

    text-decoration:none;

    color:inherit;

    cursor:pointer;

    transition:.25s;
}

.owner-box:hover{

    background:#faf8f5;
}

.owner-profile{

    width:100%;

    display:flex;

    align-items:center;

    gap:10px;

    padding:5px 8px;
}

.owner-profile img{

    width:48px;

    height:48px;

    flex-shrink:0;

    border-radius:50%;

    object-fit:cover;

    border:1px solid #eee;

    transition:.25s;
}

.owner-box:hover .owner-profile img{

    transform:scale(1.04);
}

.owner-name-area{

    min-width:0;

    flex:1;
}

.owner-name{

    font-size:14px;

    font-weight:700;

    color:#292929;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.owner-role{

    margin-top:1px;

    font-size:11px;

    color:#888;
}


/* =========================================================
   CONTACT
========================================================= */

.contact{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px;

    margin-top:5px;
}

.contact p{

    margin:0;

    min-width:0;

    padding:8px 9px;

    border-radius:10px;

    background:#f7f7f7;

    color:#555;

    font-size:11px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   OWNER ACTIONS
========================================================= */

.owner-actions{

    display:flex;

    gap:7px;

    margin-top:12px;
}

.status-btn,
.delete-btn{

    flex:1;

    min-height:38px;

    padding:8px 10px;

    border:none;

    border-radius:9px;

    color:white;

    cursor:pointer;

    font-size:13px;

    font-weight:600;

    transition:.25s;
}

.status-btn{

    background:#2e7d32;
}

.delete-btn{

    background:#d32f2f;
}

.status-btn:hover{

    background:#1b5e20;

    transform:translateY(-1px);
}

.delete-btn:hover{

    background:#b71c1c;

    transform:translateY(-1px);
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state{

    grid-column:1 / -1;

    padding:60px 20px;

    text-align:center;

    color:#777;

    background:#fff;

    border-radius:20px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.06);
}

.empty-state h2{

    font-size:22px;

    margin-bottom:8px;

    color:#555;
}

.empty-state p{

    color:#999;

    font-size:14px;
}


/* =========================================================
   FULL IMAGE VIEWER
========================================================= */

.image-viewer{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.88);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:30px;

    opacity:0;

    visibility:hidden;

    transition:.3s;

    z-index:999999;
}

.image-viewer.show{

    opacity:1;

    visibility:visible;
}

.image-viewer img{

    max-width:95vw;

    max-height:90vh;

    width:auto;

    height:auto;

    object-fit:contain;

    border-radius:15px;

    box-shadow:
        0 10px 40px rgba(0,0,0,.5);

    transform:scale(.9);

    transition:.3s;
}

.image-viewer.show img{

    transform:scale(1);
}

.image-viewer-close{

    position:absolute;

    top:20px;

    right:25px;

    width:50px;

    height:50px;

    border:none;

    border-radius:50%;

    background:rgba(255,255,255,.15);

    color:white;

    font-size:30px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:.2s;

    z-index:2;
}

.image-viewer-close:hover{

    background:rgba(255,255,255,.3);

    transform:scale(1.08);
}


/* =========================================================
   NOTIFY
========================================================= */

.notify-box{

    position:fixed;

    top:30px;

    right:30px;

    background:#c8a77c;

    color:white;

    padding:18px 25px;

    border-radius:18px;

    font-weight:bold;

    box-shadow:
        0 5px 20px rgba(0,0,0,.2);

    z-index:99999;

    opacity:0;

    transform:translateY(-20px);

    transition:.4s;
}

.notify-box.show{

    opacity:1;

    transform:translateY(0);
}


/* =========================================================
   BANNER
========================================================= */

.banner{

    position:relative;

    width:100%;

    height:45vw;

    min-height:220px;

    max-height:420px;

    margin:0 auto;

    background-image:
        url("img/banner2.png");

    background-size:cover;

    background-position:center center;

    background-repeat:no-repeat;

    overflow:hidden;

    border-radius:
        0 0 30px 30px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.15);
}

.banner::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        rgba(0,0,0,.08);

    z-index:1;

    pointer-events:none;
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar{

    position:absolute;

    top:25px;

    left:35px;

    right:35px;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    z-index:9999;
}

.left-menu{

    display:flex;

    gap:15px;

    flex-wrap:wrap;
}

.menu-item{

    position:relative;
}

.menu-btn{

    padding:14px 25px;

    border:none;

    border-radius:15px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    color:#796247;

    background:
        rgba(255,255,255,.18);

    backdrop-filter:
        blur(10px);

    border:
        1px solid rgba(255,255,255,.25);

    transition:.3s;

    display:flex;

    align-items:center;

    justify-content:center;
}

.menu-btn:hover{

    transform:translateY(-5px);

    background:
        rgba(255,255,255,.3);

    box-shadow:
        0 10px 20px rgba(0,0,0,.2);
}


/* =========================================================
   DESKTOP DROPDOWN
========================================================= */

.dropdown{

    position:absolute;

    top:70px;

    left:0;

    background:white;

    border-radius:18px;

    min-width:220px;

    padding:10px 0;

    box-shadow:
        0 5px 20px rgba(0,0,0,.15);

    opacity:0;

    visibility:hidden;

    transform:translateY(10px);

    transition:.25s;

    z-index:99999;
}

.menu-item::after{

    content:"";

    position:absolute;

    left:0;

    top:55px;

    width:100%;

    height:25px;
}

.dropdown a{

    display:block;

    padding:18px 22px;

    color:#444;

    font-weight:bold;

    transition:.3s;
}

.dropdown a:hover{

    background:#f2e4d3;
}

.menu-item:hover .dropdown{

    opacity:1;

    visibility:visible;

    transform:translateY(0);
}


/* =========================================================
   RIGHT MENU
========================================================= */

.right-menu{

    display:flex;

    gap:15px;
}


/* =========================================================
   USER PROFILE
========================================================= */

.user-dropdown{

    position:relative;
}

.user-profile{

    display:flex;

    align-items:center;

    gap:12px;

    padding:8px 15px;

    border-radius:15px;

    background:
        rgba(255,255,255,.18);

    backdrop-filter:
        blur(10px);

    border:
        1px solid rgba(255,255,255,.25);

    cursor:pointer;
}

.user-profile img{

    width:45px;

    height:45px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid white;
}

.user-profile span{

    color:#796247 !important;

    font-weight:600;

    font-size:16px;
}


/* =========================================================
   USER DROPDOWN
========================================================= */

.dropdown-menu{

    position:absolute;

    top:65px;

    right:0;

    width:220px;

    background:white;

    border-radius:15px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.15);

    display:none;

    overflow:hidden;
}

.dropdown-menu.show{

    display:block;
}

.dropdown-menu a{

    display:block;

    padding:15px 20px;

    color:#444;

    text-decoration:none;
}

.dropdown-menu a:hover{

    background:#f3f3f3;
}


/* =========================================================
   SCROLLED NAVBAR
========================================================= */

.navbar.scrolled{

    position:fixed;

    top:0;

    left:0;

    width:100%;

    padding:15px 40px;

    background:
        rgba(255,255,255,.95);

    backdrop-filter:
        blur(10px);

    box-shadow:
        0 2px 10px rgba(0,0,0,.08);
}

.navbar.scrolled .menu-btn{

    background:#c8a77c;

    color:white;

    border:none;
}


/* =========================================================
   MOBILE MENU BUTTON
========================================================= */

.menu-toggle{

    display:none;

    font-size:28px;

    color:#6b4f33;

    cursor:pointer;

    padding:8px 14px;

    border-radius:12px;

    background:
        rgba(255,255,255,.85);

    backdrop-filter:
        blur(10px);

    z-index:1002;
}

.navbar.scrolled .menu-toggle{

    background:#d8c5ad;

    border:
        1px solid #b08a61;

    box-shadow:
        0 4px 12px rgba(0,0,0,.18);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    position:fixed;

    top:0;

    left:-300px;

    width:280px;

    height:100vh;

    padding:25px;

    background:#796247;

    transition:.35s;

    z-index:100001;

    overflow-y:auto;
}

.sidebar.active{

    left:0;
}

.sidebar-buttons{

    display:flex;

    gap:10px;

    margin-bottom:30px;
}

.sidebar-buttons a{

    flex:1;

    text-align:center;

    padding:15px;

    border-radius:12px;

    color:#fff;

    text-decoration:none;

    font-weight:600;
}

.register-btn,
.login-btn{

    background:#6A513A;
}


/* =========================================================
   SIDEBAR MENU
========================================================= */

.sidebar ul{

    list-style:none;

    padding:0;

    margin:0;
}

.sidebar li{

    margin:0;
}

.sidebar li a,
.dropdown-btn{

    display:flex;

    justify-content:space-between;

    align-items:center;

    width:100%;

    padding:14px 0;

    background:none;

    border:none;

    color:#fff;

    font-size:18px;

    font-weight:500;

    text-decoration:none;

    cursor:pointer;

    text-align:left;
}

.submenu{

    display:none;

    list-style:none;

    padding-left:20px;
}

.submenu.show{

    display:block;
}

.submenu li a{

    padding:10px 0;

    font-size:17px;
}

.arrow{

    transition:.3s;
}

.arrow.rotate{

    transform:rotate(90deg);
}


/* =========================================================
   SIDEBAR USER
========================================================= */

.sidebar-user{

    display:flex;

    align-items:center;

    gap:15px;

    margin-bottom:30px;
}

.sidebar-user img{

    width:55px;

    height:55px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid #fff;
}

.sidebar-info{

    display:flex;

    flex-direction:column;
}

.sidebar-name{

    color:#fff;

    font-size:24px;

    font-weight:bold;
}

.sidebar-link{

    color:#eee;

    text-decoration:none;

    margin-top:6px;

    font-size:15px;
}

.sidebar-link.logout{

    color:#ffd6d6;
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay{

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:
        rgba(0,0,0,.5);

    opacity:0;

    visibility:hidden;

    transition:.3s;

    z-index:100000;
}

.overlay.active{

    opacity:1;

    visibility:visible;
}


/* =========================================================
   FLOATING AI BUTTON
========================================================= */

.floating-ai{

    position:fixed;

    right:30px;

    bottom:120px;

    width:70px;

    height:70px;

    border:none;

    border-radius:50%;

    background:#4A90E2;

    color:white;

    font-size:34px;

    cursor:pointer;

    box-shadow:
        0 5px 20px rgba(0,0,0,.25);

    z-index:9999;

    transition:.3s;

    display:flex;

    align-items:center;

    justify-content:center;
}

.floating-ai:hover{

    transform:translateY(-5px);

    background:#357ABD;
}


/* =========================================================
   CHAT BUTTON
========================================================= */

.chat-btn{

    position:fixed;

    right:30px;

    bottom:120px;

    width:70px;

    height:70px;

    border:none;

    border-radius:50%;

    background:#4da6ff;

    color:white;

    font-size:34px;

    cursor:pointer;

    box-shadow:
        0 5px 20px rgba(0,0,0,.25);

    z-index:9999;

    transition:.3s;

    display:flex;

    align-items:center;

    justify-content:center;
}

.chat-btn:hover{

    transform:translateY(-5px);

    box-shadow:
        0 10px 25px rgba(0,0,0,.3);
}

.chat-btn:active{

    transform:
        translateY(-2px)
        scale(.92);
}


/* =========================================================
   CHAT POPUP
========================================================= */

.chatbot-popup{

    position:fixed;

    right:20px;

    bottom:20px;

    width:500px;

    height:700px;

    background:#fff;

    border-radius:25px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.3);

    overflow:hidden;

    display:none;

    z-index:100000;
}

.chat-header{

    height:65px;

    background:#4da6ff;

    color:white;

    padding:15px;

    display:flex;

<script type="module">


/* =========================================================
   IMPORT FIREBASE
========================================================= */

import { auth, db }
from "./firebase.js";


import {

    onAuthStateChanged,

    signOut

}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";


import {

    doc,

    getDoc,

    collection,

    getDocs,

    updateDoc,

    deleteDoc

}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


/* =========================================================
   ELEMENTS
========================================================= */

const userMenu =
    document.getElementById("userMenu");

const sidebarUserMenu =
    document.getElementById(
        "sidebarUserMenu"
    );

const catContainer =
    document.getElementById(
        "catContainer"
    );

const districtFilter =
    document.getElementById(
        "districtFilter"
    );


/* =========================================================
   VARIABLES
========================================================= */

let allCats = [];

let currentUser = null;

let isAdmin = false;


const params =
    new URLSearchParams(
        window.location.search
    );

const catId =
    params.get("id");


/* =========================================================
   PAGE LOADING
========================================================= */

async function finishPageLoading(){

    const loader =
        document.getElementById(
            "pageLoader"
        );


    if(!loader){

        return;

    }


    const images =
        Array.from(
            document.images
        );


    await Promise.all(

        images.map(
            img => {

                if(img.complete){

                    return Promise.resolve();

                }


                return new Promise(
                    resolve => {

                        img.addEventListener(
                            "load",
                            resolve,
                            {once:true}
                        );

                        img.addEventListener(
                            "error",
                            resolve,
                            {once:true}
                        );

                    }
                );

            }
        )

    );


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                300
            )
    );


    loader.classList.add(
        "hide"
    );


    setTimeout(
        () => loader.remove(),
        500
    );

}


/* =========================================================
   FILTER
========================================================= */

districtFilter.addEventListener(
    "change",
    async function(){

        const district =
            districtFilter.value;


        if(
            district === "ทั้งหมด"
        ){

            await renderCats(
                allCats
            );

            return;

        }


        const filteredCats =
            allCats.filter(
                cat =>
                    cat.district ===
                    district
            );


        await renderCats(
            filteredCats
        );

    }
);


/* =========================================================
   OWNER PROFILE
========================================================= */

async function getOwnerProfile(uid){

    if(!uid){

        return {

            username:"ผู้ใช้",

            profile:
                "img/default-profile.png"

        };

    }


    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "users",
                    uid
                )
            );


        if(!snap.exists()){

            return {

                username:"ผู้ใช้",

                profile:
                    "img/default-profile.png"

            };

        }


        const user =
            snap.data();


        return {

            username:
                user.username ||
                "ผู้ใช้",

            profile:
                user.profile ||
                "img/default-profile.png"

        };

    }catch(error){

        console.error(
            "Owner profile error:",
            error
        );


        return {

            username:"ผู้ใช้",

            profile:
                "img/default-profile.png"

        };

    }

}


/* =========================================================
   LOAD CATS
========================================================= */

async function loadCats(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "cats"
                )
            );


        allCats = [];


        snapshot.forEach(
            catDoc => {

                allCats.push({

                    id:catDoc.id,

                    ...catDoc.data()

                });

            }
        );


        /* =================================================
           SORT

           1. ล่าสุดอยู่ด้านบน
           2. ได้บ้านแล้วอยู่ด้านล่าง
        ================================================= */

        allCats.sort(
            (a,b) => {

                const aAdopted =
                    a.adoptionStatus ===
                    "ได้บ้านแล้ว";

                const bAdopted =
                    b.adoptionStatus ===
                    "ได้บ้านแล้ว";


                if(
                    aAdopted &&
                    !bAdopted
                ){

                    return 1;

                }


                if(
                    !aAdopted &&
                    bAdopted
                ){

                    return -1;

                }


                const aTime =
                    a.createdAt?.toMillis
                    ? a.createdAt.toMillis()
                    : new Date(
                        a.createdAt || 0
                    ).getTime();


                const bTime =
                    b.createdAt?.toMillis
                    ? b.createdAt.toMillis()
                    : new Date(
                        b.createdAt || 0
                    ).getTime();


                return bTime - aTime;

            }
        );


        console.log(
            "Cats:",
            allCats
        );


        if(catId){

            const cat =
                allCats.filter(
                    item =>
                        item.id === catId
                );


            await renderCats(
                cat
            );

        }else{

            await renderCats(
                allCats
            );

        }

    }catch(error){

        console.error(
            "Load cats error:",
            error
        );


        catContainer.innerHTML = `

            <div class="empty-state">

                <h2>
                    ไม่สามารถโหลดข้อมูลได้
                </h2>

                <p>
                    กรุณาลองใหม่อีกครั้ง
                </p>

            </div>

        `;

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "-";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   IMAGE URL FOR ONCLICK
========================================================= */

function escapeJSString(value){

    return String(value || "")

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}


/* =========================================================
   RENDER CATS
========================================================= */

async function renderCats(data){

if(data.length === 0){

}

    const catsWithOwner =

                        );


                    return {

                        ...cat,

                        owner

                    };

                }
            )

        );


    /* =====================================================
       CREATE CARDS
    ===================================================== */

    catsWithOwner.forEach(
        cat => {


            const image =
                cat.image ||
                "img/default-pet.png";


            const adoptionStatus =
                cat.adoptionStatus ||
                cat.status ||
                "กำลังหาบ้าน";


            const statusClass =
                adoptionStatus ===
                "ได้บ้านแล้ว"
                ? "adopted"
                : "available";


            const imageForJS =
                escapeJSString(
                    image
                );


            const province =
                cat.province ||
                "ไม่ระบุ";


            const district =
                cat.district ||
                "ไม่ระบุ";


            const subdistrict =
                cat.subdistrict ||
                "ไม่ระบุ";


            catContainer.innerHTML += `

/* =========================================================
   CHANGE STATUS
========================================================= */

window.changeCatStatus =
    async function(id){

        const status =
            prompt(
`เลือกสถานะ

กำลังหาบ้าน
ได้บ้านแล้ว`
            );


        if(!status){

            return;

        }


        if(
            status !==
                "กำลังหาบ้าน" &&
            status !==
                "ได้บ้านแล้ว"
        ){

            alert(
                "กรุณาเลือกสถานะให้ถูกต้อง"
            );

            return;

        }


        try{

            await updateDoc(

                doc(
                    db,
                    "cats",
                    id
                ),

                {

                    adoptionStatus:
                        status

                }

            );


            alert(
                "อัปเดตสถานะเรียบร้อย"
            );


            await loadCats();

        }catch(error){

            console.error(
                error
            );

            alert(
                "ไม่สามารถอัปเดตสถานะได้"
            );

        }

    };


/* =========================================================
   DELETE CAT
========================================================= */

window.deleteCat =
    async function(id){

        const cat =
            allCats.find(
                item =>
                    item.id === id
            );


        if(!cat){

            return;

        }


        if(
            !currentUser ||
            (
                currentUser.uid !==
                cat.ownerUid &&
                !isAdmin
            )
        ){

            alert(
                "คุณไม่มีสิทธิ์ลบโพสต์นี้"
            );

            return;

        }


        const ok =
            confirm(
                "ต้องการลบโพสต์นี้หรือไม่"
            );


        if(!ok){

            return;

        }


        try{

            await deleteDoc(

                doc(
                    db,
                    "cats",
                    id
                )

            );


            alert(
                "ลบโพสต์เรียบร้อย"
            );


            await loadCats();

        }catch(error){

            console.error(
                error
            );

            alert(
                "ไม่สามารถลบโพสต์ได้"
            );

        }

    };


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async user => {


        currentUser =
            user;


        isAdmin = false;


        console.log(
            "Auth =",
            user
        );


        /* =================================================
           LOGGED IN
        ================================================= */

        if(user){

            const snap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            let username =
                "User";


            let photo =
                "img/default-profile.png";


            if(snap.exists()){

                const userData =
                    snap.data();


                username =
                    userData.username ||
                    "User";


                photo =
                    userData.profile ||
                    "img/default-profile.png";


                isAdmin =
                    userData.role ===
                    "admin";

            }


            /* =============================================
               DESKTOP USER
            ============================================= */

            userMenu.innerHTML = `

                <div
                    class="user-dropdown">


                    <div
                        class="user-profile"
                        id="profileBtn">


                        <img
                            src="${escapeHTML(photo)}"
                            alt="โปรไฟล์">


                        <span>

                            ${escapeHTML(
                                username
                            )}

                        </span>


                    </div>



                    <div
                        class="dropdown-menu"
                        id="dropdownMenu">


                        <a href="profile.html">

                            โปรไฟล์

                        </a>


                        <a
                            href="#"
                            id="logoutBtn">

                            ออกจากระบบ

                        </a>


                    </div>


                </div>

            `;


            /* =============================================
               MOBILE USER
            ============================================= */

            sidebarUserMenu.className = "";


            sidebarUserMenu.innerHTML = `

                <div
                    class="sidebar-user">


                    <img

                        src="${escapeHTML(photo)}"

                        class="sidebar-photo"

                        alt="รูปโปรไฟล์"

                    >


                    <div>


                        <div
                            class="sidebar-name">

                            ${escapeHTML(
                                username
                            )}

                        </div>


                        <a
                            href="profile.html"
                            class="sidebar-link">

                            โปรไฟล์

                        </a>


                        <a
                            href="#"
                            id="sidebarLogout"
                            class="sidebar-link logout">

                            ออกจากระบบ

                        </a>


                    </div>


                </div>

            `;


            /* =============================================
               DESKTOP PROFILE DROPDOWN
            ============================================= */

            const profileBtn =
                document.getElementById(
                    "profileBtn"
                );


            const dropdownMenu =
                document.getElementById(
                    "dropdownMenu"
                );


            if(profileBtn){

                profileBtn.addEventListener(
                    "click",
                    function(){

                        dropdownMenu.classList.toggle(
                            "show"
                        );

                    }
                );

            }


            /* =============================================
               DESKTOP LOGOUT
            ============================================= */

            const logoutBtn =
                document.getElementById(
                    "logoutBtn"
                );


            if(logoutBtn){

                logoutBtn.addEventListener(
                    "click",
                    async function(e){

                        e.preventDefault();

                        await signOut(auth);

                        location.reload();

                    }
                );

            }


            /* =============================================
               MOBILE LOGOUT
            ============================================= */

            const sidebarLogout =
                document.getElementById(
                    "sidebarLogout"
                );


            if(sidebarLogout){

                sidebarLogout.addEventListener(
                    "click",
                    async function(e){

                        e.preventDefault();

                        await signOut(auth);

                        location.reload();

                    }
                );

            }

        }


        /* =================================================
           LOGGED OUT
        ================================================= */

        else{

            userMenu.innerHTML = `

                <a
                    href="register.html"
                    class="menu-btn">

                    ลงทะเบียน

                </a>


                <a
                    href="login.html"
                    class="menu-btn">

                    เข้าสู่ระบบ

                </a>

            `;


            sidebarUserMenu.className =
                "sidebar-buttons";


            sidebarUserMenu.innerHTML = `

                <a
                    href="register.html"
                    class="register-btn">

                    ลงทะเบียน

                </a>


                <a
                    href="login.html"
                    class="login-btn">

                    เข้าสู่ระบบ

                </a>

            `;

        }


        /* =================================================
           LOAD CATS
        ================================================= */

        await loadCats();


        /* =================================================
           FINISH LOADER
        ================================================= */

        await finishPageLoading();

    }
);


/* =========================================================
   CHATBOT
========================================================= */

const chatBtn =
    document.getElementById(
        "chatBtn"
    );

const chatPopup =
    document.getElementById(
        "chatPopup"
    );

const closeChat =
    document.getElementById(
        "closeChat"
    );


const isMobile =
    () =>
        window.innerWidth <= 768;


chatBtn.addEventListener(
    "click",
    function(){

        if(isMobile()){

            chatPopup.classList.add(
                "show"
            );

            document.body.classList.add(
                "no-scroll"
            );

        }else{

            chatPopup.style.display =
                "block";

        }


        chatBtn.style.display =
            "none";

    }
);


closeChat.addEventListener(
    "click",
    function(){

        if(isMobile()){

            chatPopup.classList.remove(
                "show"
            );

            document.body.classList.remove(
                "no-scroll"
            );

        }else{

            chatPopup.style.display =
                "none";

        }


        chatBtn.style.display =
            "flex";

    }
);


/* =========================================================
   FULL IMAGE VIEWER
========================================================= */

const imageViewer =
    document.getElementById(
        "imageViewer"
    );

const fullImage =
    document.getElementById(
        "fullImage"
    );

const imageViewerClose =
    document.getElementById(
        "imageViewerClose"
    );


window.openImageViewer =
    function(imageUrl){

        fullImage.src =
            imageUrl;

        imageViewer.classList.add(
            "show"
        );

        document.body.classList.add(
            "no-scroll"
        );

    };


function closeImageViewer(){

    imageViewer.classList.remove(
        "show"
    );

    document.body.classList.remove(
        "no-scroll"
    );


    setTimeout(
        () => {

            fullImage.src = "";

        },
        300
    );

}


/* =========================================================
   CLOSE IMAGE
========================================================= */

imageViewerClose.addEventListener(
    "click",
    closeImageViewer
);


/* =========================================================
   CLICK BACKGROUND
========================================================= */

imageViewer.addEventListener(
    "click",
    function(e){

        if(
            e.target ===
            imageViewer
        ){

            closeImageViewer();

        }

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key ===
            "Escape"
        ){

            closeImageViewer();

        }

    }
);

</script>
