<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PetPaw AI Assistant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ==========================
   Typing
========================== */

.typing{

    display:inline-flex;

    gap:6px;

    padding:12px 18px;

    background:white;

    border-radius:18px;

    margin-top:12px;

}

.typing span{

    width:8px;
    height:8px;

    background:#999;

    border-radius:50%;

    animation:blink 1s infinite;

}

.typing span:nth-child(2){
    animation-delay:.2s;
}

.typing span:nth-child(3){
    animation-delay:.4s;
}

@keyframes blink{

    0%,80%,100%{
        opacity:.2;
    }

    40%{
        opacity:1;
    }

}

/* ==========================
   ปุ่มคำถาม
========================== */

.quick-btn{

    width:100%;

    padding:13px;

    margin-top:10px;

    border:none;

    border-radius:14px;

    background:#3B82F6;

    color:white;

    cursor:pointer;

    font-size:15px;

    transition:.25s;

}

.quick-btn:hover{

    background:#2563EB;

    transform:translateY(-2px);

}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Prompt",sans-serif;
}

body{

    background:#f5f6fa;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

}

/* ===========================
    CHAT BOX
=========================== */

.chat-container{

    width:420px;

    height:700px;

    background:white;

    border-radius:25px;

    overflow:hidden;

    box-shadow:0 10px 35px rgba(0,0,0,.15);

    display:flex;

    flex-direction:column;

}

/* ===========================
    HEADER
=========================== */

.chat-header{

    background:#3B82F6;

    color:white;

    padding:20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.chat-header h2{

    font-size:22px;

}

.back-btn{

    color:white;

    text-decoration:none;

    font-size:26px;

    font-weight:bold;

}

/* ===========================
    CHAT AREA
=========================== */

.chat-area{

    flex:1;

    padding:20px;

    overflow-y:auto;

    background:#f7f7f7;

}

/* Bot Message */

.bot{

    background:white;

    width:fit-content;

    max-width:90%;

    padding:15px;

    margin-bottom:15px;

    border-radius:18px;

    box-shadow:0 3px 10px rgba(0,0,0,.08);

    animation:fade .25s;

}

/* User Message */

.user{

    background:#3B82F6;

    color:white;

    margin-left:auto;

    width:fit-content;

    max-width:90%;

    padding:15px;

    margin-bottom:15px;

    border-radius:18px;

    animation:fade .25s;

}

/* ===========================
    MENU BUTTON
=========================== */

.menu{

    padding:15px;

    background:white;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}

.menu button{

    padding:15px;

    border:none;

    border-radius:15px;

    background:#3B82F6;

    color:white;

    font-size:15px;

    cursor:pointer;

    transition:.25s;

}

.menu button:hover{

    background:#2563EB;

    transform:translateY(-3px);

}

/* ===========================
    SCROLL BAR
=========================== */

.chat-area::-webkit-scrollbar{

    width:8px;

}

.chat-area::-webkit-scrollbar-thumb{

    background:#cccccc;

    border-radius:10px;

}

/* ===========================
    ANIMATION
=========================== */

@keyframes fade{

from{

opacity:0;

transform:translateY(15px);

}

to{

opacity:1;

transform:translateY(0);

}

}

/* ===========================
    MOBILE
=========================== */

@media(max-width:768px){

.chat-container{

width:100%;

height:100vh;

border-radius:0;

}

}

</style>

</head>

สวัสดีครับ 👋<br><br>

<script>

const chatArea = document.getElementById("chatArea");


/* ==========================
    เพิ่มข้อความผู้ใช้
========================== */

function user(text){

    chatArea.innerHTML += `
        <div class="user">
            ${text}
        </div>
    `;

    chatArea.scrollTop = chatArea.scrollHeight;

}

/* ==========================
    เพิ่มข้อความ
========================== */

function bot(text){

    chatArea.innerHTML += `
        <div class="bot">
            ${text}
        </div>
    `;

    chatArea.scrollTop = chatArea.scrollHeight;

}

/* ==========================
    แสดงปุ่มคำถาม
========================== */

function showButtons(list){

    let html=`<div class="bot">`;

    list.forEach(item=>{

        html+=`

<button
class="quick-btn"
onclick="${item.action}">

${item.text}

</button>

`;

    });

    html+="</div>";

    chatArea.innerHTML+=html;

    chatArea.scrollTop=chatArea.scrollHeight;

}

/* ==========================
    เมนูสุนัข
========================== */

function dogMenu(){

    user("🐶 สุนัข");

    bot("คุณต้องการสอบถามเรื่องอะไร");

    showButtons([

        {
            text:"การให้อาหาร",
            action:"dogFood()"
        },

        {
            text:"การอาบน้ำ",
            action:"dogBath()"
        },

        {
            text:"การฉีดวัคซีน",
            action:"dogVaccine()"
        },

        {
            text:"กลับเมนูหลัก",
            action:"mainMenu()"
        }

    ]);

}

function dogFood(){

    user("การให้อาหาร");

    bot(`
    <b>อาหารสำหรับลูกสุนัขอายุ 1 เดือนครึ่ง – 2 เดือนครึ่ง</b>

   
    <br><br>

    • อาหารเม็ดสำเร็จรูปสำหรับลูกสุนัข (แช่อาหารเม็ดในน้ำอุ่นแล้วเทน้ำอุ่นทิ้งเหลือแต่อาหารเม็ดนิ่ม ๆ)<br>
    • นมแพะสำหรับลูกสุนัข<br>
    • แบ่งอาหารวันละ 3-4 มื้อ

    <br><br>

    <b>อาหารสำหรับสุนัขอายุ 2 เดือนครึ่ง – 12 เดือน</b>

   
    <br><br>

    • อาหารเม็ดสำเร็จรูปสำหรับลูกสุนัข (ไม่ต้องแช่น้ำอุ่น)<br>
    • ไข่ต้ม เลือกเอาเฉพาะไข่แดง คลุกรวมกับอาหารเม็ด<br>
    • นมแพะ<br>
    • แบ่งอาหารวันละ 3-4 มื้อ

    <br><br>

    <b>อาหารสำหรับสุนัขอายุ 12 เดือน ขึ้นไป</b>

   
    <br><br>

    • เนื้อบด <br>
    • ข้าว  <br>
    • ผักต้มในน้ำซุป   <br>
    ผสม 3 อย่างในอัตราส่วนเท่า ๆ กัน ควรเพิ่มกระดูกอ่อนสำหรับกัดแทะเพื่อรักษาฟันให้แข็งแรงและสะอาด กระดูกที่เลือกควรเป็นกระดูกที่เคี้ยวได้ ไม่ควรให้กระดูกไก่เพราะกระดูกไก่เมื่อเคี้ยวจะแตกกระจายเป็นชิ้นเล็ก ๆ สามารถเข้าไปตำลำไส้ทำให้สุนัขมีปัญหาได้ และควรให้อาหารในเวลาเดียวกันสม่ำเสมอ
    <br><br>

    <b>อาหารสำหรับสุนัขวัยชรา  </b>

   
    <br><br>

    สุนัขที่อายุเยอะแล้วจะมีปัญหาเรื่องฟันที่ไม่สามารถบดเคี้ยวอาหารได้เหมือนเดิม เจ้าของอาจจะต้องปรับอาหารให้นิ่มขึ้น เลือกอาหารเม็ดที่ระบุว่าเหมาะกับสุนัขวัยชรา เพราะสุนัขวัยนี้ไม่ค่อยชอบเคลื่อนไหว จะชอบกินแล้วก็นอนเป็นส่วนใหญ่ ซึ่งหากได้รับสารอาหารที่เกินความจำเป็นก็อาจทำให้เกิดโรคอ้วน โรคเบาหวาน โรคหัวใจ และไขข้อเสื่อมได้ ดังนั้นเจ้าของต้องปรับสูตรอาหารที่ลดปริมาณโปรตีน แร่ธาตุบางอย่าง และเกลือลง เพื่อช่วยลดการทำงานของไต และควรเตรียมน้ำไว้เยอะ ๆ ใกล้จุดที่สุนัขชอบไปอยู่ เพราะเมื่อสุนัขอายุมากขึ้นก็มักจะกินน้ำน้อยลงเสี่ยงต่อภาวะขาดน้ำ
    <br><br>

    <br><br>

    อย่าให้อาหารที่มีรสเค็มจัดหรือช็อกโกแลต
    `);

}

function catFood(){

    user("การให้อาหาร");

    bot(`

<b>อาหารสำหรับลูกแมวอายุ 1 – 2 เดือน</b>

<br><br>

• นมสำหรับลูกแมวโดยเฉพาะ (ห้ามใช้นมวัว)<br>
• อาหารเม็ดสำหรับลูกแมว แช่น้ำอุ่นให้นิ่ม หรืออาหารเปียกสำหรับลูกแมว<br>
• แบ่งอาหารวันละ 4–5 มื้อ<br>
• ควรมีน้ำสะอาดให้ตลอดเวลา

<br><br>

<b>อาหารสำหรับลูกแมวอายุ 2 – 6 เดือน</b>

<br><br>

• อาหารเม็ดสำหรับลูกแมว (ไม่ต้องแช่น้ำอุ่น)<br>
• อาหารเปียกสำหรับลูกแมว วันละ 1–2 มื้อ<br>
• ไข่ต้ม (ให้เฉพาะไข่แดง สัปดาห์ละ 1–2 ครั้ง)<br>
• แบ่งอาหารวันละ 3–4 มื้อ

<br><br>

<b>อาหารสำหรับแมวอายุ 6 – 12 เดือน</b>

<br><br>

• อาหารเม็ดสูตรลูกแมว หรือสูตรแมวโตช่วงเปลี่ยนวัย<br>
• เนื้อไก่ต้ม หรือปลาต้มไม่ปรุงรส สามารถให้เสริมได้<br>
• อาหารเปียกเสริมได้เป็นครั้งคราว<br>
• แบ่งอาหารวันละ 2–3 มื้อ

<br><br>

<b>อาหารสำหรับแมวโต (อายุ 1 ปีขึ้นไป)</b>

<br><br>

• อาหารเม็ดสูตรแมวโต<br>
• อาหารเปียกเสริมวันละ 1 มื้อ หรือสลับกับอาหารเม็ด<br>
• เนื้อไก่ต้ม ปลาต้ม หรืออกไก่ต้มไม่ปรุงรส สามารถให้เป็นอาหารเสริมได้<br>
• ให้อาหารวันละ 2 มื้อ และควบคุมปริมาณไม่ให้มากเกินไปเพื่อป้องกันโรคอ้วน

<br><br>

<b>อาหารสำหรับแมวสูงวัย (อายุ 7 ปีขึ้นไป)</b>

<br><br>

• เลือกอาหารสูตร Senior Cat หรืออาหารสำหรับแมวสูงวัย<br>
• หากเคี้ยวลำบาก ควรใช้อาหารเปียกหรือแช่อาหารเม็ดให้นิ่ม<br>
• ลดอาหารที่มีไขมันสูง และเลือกสูตรที่ย่อยง่าย<br>
• ควรมีน้ำสะอาดหลายจุดภายในบ้าน เพราะแมวสูงวัยมักดื่มน้ำน้อย

<br><br>

<b>อาหารที่ไม่ควรให้แมวกิน</b>

<br><br>

• ช็อกโกแลต<br>
• หอมหัวใหญ่ และกระเทียม<br>
• องุ่น และลูกเกด<br>
• นมวัว (อาจทำให้ท้องเสีย)<br>
• กระดูกปลาและก้างปลา<br>
• อาหารรสเค็มจัด หรืออาหารปรุงรสสำหรับคน<br>
• เครื่องดื่มแอลกอฮอล์ และเครื่องดื่มที่มีคาเฟอีน

<br><br>

<b>คำแนะนำเพิ่มเติม</b>

<br><br>

• เปลี่ยนน้ำสะอาดทุกวัน<br>
• เลือกอาหารที่เหมาะกับช่วงวัยและสุขภาพของแมว<br>
• หากแมวเบื่ออาหารหรือกินอาหารได้น้อยผิดปกติ ควรพาไปพบสัตวแพทย์

`);

}

function websiteMenu(){

    user("🌐 วิธีใช้งานเว็บไซต์");

    bot(`

<h3>📖 วิธีใช้งานเว็บไซต์ PetPawTH</h3>

เว็บไซต์นี้จัดทำขึ้นเพื่อช่วยเหลือสุนัขและแมวจรจัด รวมถึงช่วยตามหาสัตว์เลี้ยงที่สูญหาย ภายในจังหวัดพัทลุง

<hr>

<h4>📝 1. สมัครสมาชิก</h4>

• สามารถเพิ่มรูปโปรไฟล์ได้ (ถ้ามี)<br>
• เมื่อลงทะเบียนสำเร็จ สามารถเข้าสู่ระบบได้ทันที

<br><br>

<h4>🔐 2. เข้าสู่ระบบ</h4>
