/* =========================================

========================================= */

.image-modal {
    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.85);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px;

    z-index: 10000;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
}


.image-modal.active {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* รูปใหญ่ */

.image-modal img {
    max-width: 90vw;

    max-height: 90vh;

    width: auto;

    height: auto;

    object-fit: contain;

    border-radius: 15px;

    box-shadow:
        0 10px 40px rgba(
            0,
            0,
            0,
            0.35

    transform: scale(0.92);

    transition:
        transform 0.25s ease;
}


.image-modal.active img {

<script type="module">


        /* =========================================
           อ่าน UID จาก URL

           profile.html
           = โปรไฟล์ตัวเอง

           profile.html?uid=xxxxx
           = โปรไฟล์ของ UID ที่ระบุ
        ========================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const profileUid =
            params.get("uid");


        /* =========================================
           Firebase
        ========================================== */

        import {
            auth,
            db
        } from "./firebase.js";


        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";


        import {
            doc,
            getDoc,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


        /* =========================================
           Elements
        ========================================== */

        const profileImage =
            document.getElementById(
                "profileImage"
            );
            /* =========================================
   PROFILE IMAGE LIGHTBOX
========================================= */

const imageModal =
    document.getElementById(
        "imageModal"
    );


const fullProfileImage =
    document.getElementById(
        "fullProfileImage"
    );


const imageModalClose =
    document.getElementById(
        "imageModalClose"
    );


/* =========================================
   กดรูปโปรไฟล์
========================================= */

profileImage.addEventListener(
    "click",
    () => {

        /*
         * ใช้รูปเดียวกับรูปโปรไฟล์
         */

        fullProfileImage.src =
            profileImage.src;


        imageModal.classList.add(
            "active"
        );


        /*
         * ป้องกันหน้าเว็บด้านหลังเลื่อน
         */

        document.body.style.overflow =
            "hidden";

    }
);


/* =========================================
   ปิดรูป
========================================= */

function closeImageModal() {

    imageModal.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";


    /*
     * ล้าง src หลังจากปิด
     */

    setTimeout(
        () => {

            fullProfileImage.src = "";

        },
        250
    );

}


/* =========================================
   ปุ่ม X
========================================= */

imageModalClose.addEventListener(
    "click",
    closeImageModal
);


/* =========================================
   คลิกพื้นที่ด้านนอกเพื่อปิด
========================================= */

imageModal.addEventListener(
    "click",
    (event) => {

        /*
         * ต้องคลิกพื้นหลัง
         * ไม่ใช่ตัวรูป
         */

        if (
            event.target === imageModal
        ) {

            closeImageModal();

        }

    }
);


/* =========================================
   กด ESC เพื่อปิด
========================================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Escape" &&
            imageModal.classList.contains(
                "active"
            )
        ) {

            closeImageModal();

        }

    }
);

           แสดงข้อมูลหรือ -
        ========================================== */

        function displayValue(value) {

            if (
                value === undefined ||
                value === null ||
                String(value).trim() === ""
            ) {

                return "-";

            }


            return String(value);

        }


        /* =========================================
           Format วันที่
        ========================================== */

        function formatDate(value) {

            if (!value) {

                return "-";

            }


            try {

                let date;


                if (
                    typeof value.toDate ===
                    "function"
                ) {

                    date =
                        value.toDate();

                } else if (
                    value instanceof Date
                ) {

                    date =
                        value;

                } else {

                    date =
                        new Date(value);

                }


                if (
                    isNaN(
                        date.getTime()
                    )
                ) {

                    return "-";

                }


                return date.toLocaleDateString(
                    "th-TH",
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );


            } catch (error) {

                console.error(
                    "formatDate error:",
                    error
                );


                return "-";

            }

        }


        /* =========================================
   Facebook
========================================== */

function createFacebookLink(value) {

    if (
        !value ||
        value.trim() === ""
    ) {

        facebook.textContent = "-";

        return;
    }

    facebook.textContent =
        value.trim();
}


/* =========================================
   Instagram
========================================== */

function createInstagramLink(value) {

    if (
        !value ||
        value.trim() === ""
    ) {

        instagram.textContent = "-";

        return;
    }

    let ig =
        value.trim();

    ig =
        ig.replace(
            /^@/,
            ""
        );

    instagram.textContent =
        "@" + ig;
}


        /* =========================================
           Authentication
        ========================================== */

        onAuthStateChanged(
            auth,
            async (user) => {

                /* ===============================
                   ไม่ได้ Login
                =============================== */

                if (!user) {

                    location.href =
                        "login.html";

                    return;

                }


                try {


                    /* ===============================
                       UID
                    =============================== */

                    const uid =
                        profileUid ||
                        user.uid;


                    console.log(
                        "Login UID:",
                        user.uid
                    );


                    console.log(
                        "Profile UID:",
                        uid
                    );


                    /* ===============================
                       Edit Button

                       เจ้าของเท่านั้น
                    =============================== */

                    if (
                        uid === user.uid
                    ) {

                        editBtn.style.display =
                            "inline-flex";

                    } else {

                        editBtn.style.display =
                            "none";

                    }


                    /* ===============================
                       User Document
                    =============================== */

                    const userRef =
                        doc(
                            db,
                            "users",
                            uid
                        );


                    const userSnap =
                        await getDoc(
                            userRef
                        );


                    console.log(
                        "User exists:",
                        userSnap.exists()
                    );


                    if (
                        userSnap.exists()
                    ) {


                        const data =
                            userSnap.data();


                        console.log(
                            "User data:",
                            data
                        );


                        /* =========================
                           รูปโปรไฟล์
                        ========================== */

                        profileImage.src =
                            data.profile ||
                            "img/default-profile.png";


                        /* =========================
                           Username
                        ========================== */

                        const name =
                            displayValue(
                                data.username
                            );


                        profileName.textContent =
                            name === "-"
                                ? "User"
                                : name;


                        username.textContent =
                            name;


                        /* =========================
                           Email
                        ========================== */

                        const userEmail =
                            data.email ||
                            (
                                uid === user.uid
                                    ? user.email
                                    : ""
                            );


                        profileEmail.textContent =
                            displayValue(
                                userEmail
                            );


                        email.textContent =
                            displayValue(
                                userEmail
                            );


                        /* =========================
                           Phone
                        ========================== */

                        phone.textContent =
                            displayValue(
                                data.phone
                            );


                        /* =========================
                           Province
                        ========================== */

                        province.textContent =
                            displayValue(
                                data.province
                            );


                        /* =========================
                           District
                        ========================== */

                        district.textContent =
                            displayValue(
                                data.district
                            );


                        /* =========================
                           Address
                        ========================== */

                        address.textContent =
                            displayValue(
                                data.address
                            );


                        /* =========================
                           Facebook
                        ========================== */

                        createFacebookLink(
                            data.facebook
                        );


                        /* =========================
                           Line
                        ========================== */

                        line.textContent =
                            displayValue(
                                data.line
                            );


                        /* =========================
                           Instagram
                        ========================== */

                        createInstagramLink(
                            data.instagram
                        );


                        /* =========================
                           About
                        ========================== */

                        about.textContent =
                            displayValue(
                                data.about
                            );


                        /* =========================
                           วันที่สมัคร
                        ========================== */

                        createdAt.textContent =
                            formatDate(
                                data.createdAt
                            );


                    } else {


                        /*
                         * ถ้าไม่พบ users/{uid}
                         */

                        profileImage.src =
                            "img/default-profile.png";


                        profileName.textContent =
                            "User";


                        profileEmail.textContent =
                            "-";


                        username.textContent =
                            "-";


                        email.textContent =
                            "-";


                        phone.textContent =
                            "-";


                        province.textContent =
                            "-";


                        district.textContent =
                            "-";


                        address.textContent =
                            "-";


                        facebook.textContent =
                            "-";


                        line.textContent =
                            "-";


                        instagram.textContent =
                            "-";


                        about.textContent =
                            "-";


                        /*
                         * ถ้าเป็นเจ้าของตัวเอง
                         * ใช้วันที่สร้าง Firebase Account
                         */

                        if (
                            uid === user.uid &&
                            user.metadata.creationTime
                        ) {

                            createdAt.textContent =
                                formatDate(
                                    user.metadata
                                        .creationTime
                                );

                        } else {

                            createdAt.textContent =
                                "-";

                        }

                    }


                    /* =====================================
                       นับจำนวนสุนัข
                    ====================================== */

                    let dogTotal =
                        0;


                    const dogsSnapshot =
                        await getDocs(
                            collection(
                                db,
                                "dogs"
                            )
                        );


                    dogsSnapshot.forEach(
                        (petDoc) => {

                            const pet =
                                petDoc.data();


                            if (
                                pet.ownerUid ===
                                uid
                            ) {

                                dogTotal++;

                            }

                        }
                    );


                    /* =====================================
                       นับจำนวนแมว
                    ====================================== */

                    let catTotal =
                        0;


                    const catsSnapshot =
                        await getDocs(
                            collection(
                                db,
                                "cats"
                            )
                        );


                    catsSnapshot.forEach(
                        (petDoc) => {

                            const pet =
                                petDoc.data();


                            if (
                                pet.ownerUid ===
                                uid
                            ) {

                                catTotal++;

                            }

                        }
                    );


                    /* =====================================
                       แสดงจำนวน
                    ====================================== */

                    dogCount.textContent =
                        dogTotal;


                    catCount.textContent =
                        catTotal;


                    totalCount.textContent =
                        dogTotal +
                        catTotal;


                } catch (error) {


                    console.error(
                        "Profile error:",
                        error
                    );


                    alert(
                        "ไม่สามารถโหลดข้อมูลโปรไฟล์ได้\n\n" +
                        "Code: " +
                        (
                            error.code ||
                            "unknown"
                        ) +
                        "\n\nMessage: " +
                        error.message
                    );


                } finally {


                    /* ===============================
                       ปิด Loading
                    =============================== */

                    loading.classList.add(
                        "hidden"
                    );

                }

            }
        );

    </script>
