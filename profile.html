<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>โปรไฟล์ | PetPaw</title>


    <!-- =========================
         Google Font : Prompt
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: "Prompt", sans-serif;

            background: #f8f4ee;
    color: #444;

            min-height: 100vh;

        }
        /* =========================
           Navbar
        ========================= */

        .navbar {
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;

            background: #ffffff;

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.08);

            position: sticky;
            top: 0;

            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #796247;
            text-decoration: none;
        }

        .home-link {
            text-decoration: none;
            color: #796247;

            font-size: 16px;
            font-weight: 500;

            padding: 10px 20px;

            border-radius: 12px;

            transition: 0.25s;
        }

        .home-link:hover {
            background: #8a6847;
    color: #ffffff;
        }



        /* =========================================
           HOME BUTTON
        ========================================= */

        .home-btn {

            position: fixed;

            top: 25px;

            left: 25px;

            z-index: 100;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 10px 20px;

            background: #8a6847;
    color: #ffffff;

            text-decoration: none;

            border-radius: 12px;

            font-size: 14px;

            font-weight: 500;

            box-shadow:
                0 5px 15px rgba(
                    79,
                    70,
                    229,
                    0.20
                );

            transition: 0.25s;

        }


        .home-btn:hover {

            background: #8a6847;

            transform: translateY(-2px);

        }


        /* =========================================
           MAIN
        ========================================= */

        .container {

            width: min(
                1100px,
                calc(100% - 40px)
            );

            margin: 40px auto 60px;

        }


        /* =========================================
           PROFILE CARD
        ========================================= */

        .profile-card {

            background: #ffffff;

            border-radius: 25px;

            overflow: hidden;

            box-shadow:
                0 8px 30px rgba(
                    0,
                    0,
                    0,
                    0.07
                );

        }


        /* =========================================
           COVER
        ========================================= */

        .profile-cover {

            width: 100%;

            height: 190px;

            background:
        linear-gradient(
            135deg,
            #d8c5ad 0%,
            #c8a77c 50%,
            #f8f4ee 100%
        );

        }


        /* =========================================
           PROFILE HEADER
        ========================================= */

        .profile-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 35px;

            margin-top: -65px;

            position: relative;

        }


        .profile-left {

            display: flex;

            align-items: center;

            gap: 22px;

        }


        /* =========================================
           PROFILE IMAGE
        ========================================= */

        .profile-photo {

            width: 130px;

            height: 130px;

            border-radius: 50%;

            object-fit: cover;

            background: #ffffff;

            border: 6px solid #ffffff;

            box-shadow:
                0 5px 20px rgba(
                    0,
                    0,
                    0,
                    0.15
                );

            display: block;

        }


        /* =========================================
           PROFILE NAME
        ========================================= */

        .profile-name {

            padding-top: 65px;

        }


        .profile-name h2 {

            font-size: 27px;

            font-weight: 600;

            line-height: 1.3;

            color: #796247;

            margin-bottom: 4px;

        }


        .profile-name p {

            color: #777;

            font-size: 14px;

            word-break: break-word;

        }


        /* =========================================
           EDIT BUTTON
        ========================================= */

        .edit-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

           background: #8a6847;
    color: #ffffff;

            padding: 11px 20px;

            border-radius: 12px;

            font-size: 14px;

            font-weight: 500;

            transition: 0.25s;

            margin-top: 65px;

            white-space: nowrap;

        }


        .edit-btn:hover {

            background: #796247;

            transform: translateY(-2px);

        }


        /* =========================================
           PROFILE INFORMATION
        ========================================= */

        .profile-info {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;

            padding: 35px;

        }


        /* =========================================
           INFO BOX
        ========================================= */

        .info-box {

            background: #fdfbf8;
    border: 1px solid #d8c5ad;

            border-radius: 15px;

            padding: 18px;

            min-height: 88px;

        }


        .info-title {

            font-size: 13px;

            color: #777;

            margin-bottom: 7px;

            font-weight: 400;

        }


        .info-value {

            font-size: 15px;

            color: #444;

            font-weight: 500;

            line-height: 1.6;

            word-break: break-word;

            white-space: pre-wrap;

        }


        .info-value a {

            color: #796247;
    text-decoration: underline;

            word-break: break-all;

        }


        .info-value a:hover {

            text-decoration: underline;

        }


        /* =========================================
           STATISTICS
        ========================================= */

        .profile-stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            padding:
                0 35px 35px;

        }


        .stat-card {

            text-align: center;

            background: #fdfbf8;
    border: 1px solid #d8c5ad;

            border-radius: 18px;

            padding: 25px 15px;

            transition: 0.25s;

        }


        .stat-card:hover {

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(
                    0,
                    0,
                    0,
                    0.06
                );

        }


        .stat-card h2 {

            font-size: 30px;

            font-weight: 600;

            color: #8a6847;

            margin-bottom: 4px;

        }


        .stat-card p {

            font-size: 13px;

            color: #777;

        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            position: fixed;

            inset: 0;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.92
                );

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 9999;

            font-size: 17px;

            color: #8a6847;

        }


        .loading.hidden {

            display: none;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px) {


            .home-btn {

                top: 15px;

                left: 15px;

                padding:
                    8px 15px;

                font-size: 13px;

            }


            .container {

                width:
                    calc(100% - 20px);

                margin:
                    20px auto 40px;

                padding-top: 35px;

            }


            .profile-card {

                border-radius: 20px;

            }


            .profile-cover {

                height: 150px;

            }


            .profile-header {

                flex-direction: column;

                align-items: center;

                text-align: center;

                padding:
                    0 20px;

                margin-top: -60px;

            }


            .profile-left {

                flex-direction: column;

                gap: 10px;

            }


            .profile-photo {

                width: 120px;

                height: 120px;

            }


            .profile-name {

                padding-top: 0;

            }


            .profile-name h2 {

                font-size: 23px;

            }


            .profile-name p {

                font-size: 13px;

            }


            .edit-btn {

                width: 100%;

                margin-top: 18px;

            }


            .profile-info {

                grid-template-columns: 1fr;

                padding:
                    25px 20px;

                gap: 14px;

            }


            .profile-stats {

                grid-template-columns: 1fr;

                padding:
                    0 20px 25px;

                gap: 14px;

            }

        }


        /* =========================================
           SMALL MOBILE
        ========================================= */

        @media (max-width: 400px) {


            .profile-cover {

                height: 135px;

            }


            .profile-name h2 {

                font-size: 21px;

            }


            .profile-info {

                padding:
                    20px 15px;

            }


            .profile-stats {

                padding:
                    0 15px 20px;

            }


            .info-box {

                padding: 15px;

            }

        }

    </style>

</head>


<body>

    <!-- =========================================

    <!-- =========================================

    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script type="module">


        /* =========================================
           อ่าน UID จาก URL

           profile.html
           = โปรไฟล์ตัวเอง

           profile.html?uid=xxxxx
           = โปรไฟล์ของ UID ที่ระบุ
        ========================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const profileUid =
            params.get("uid");


        /* =========================================
           Firebase
        ========================================== */

        import {
            auth,
            db
        } from "./firebase.js";


        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";


        import {
            doc,
            getDoc,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


        /* =========================================
           Elements
        ========================================== */

        const profileImage =
            document.getElementById(
                "profileImage"
            );


        const profileName =
            document.getElementById(
                "profileName"
            );


        const profileEmail =
            document.getElementById(
                "profileEmail"
            );


        const username =
            document.getElementById(
                "username"
            );


        const email =
            document.getElementById(
                "email"
            );


        const phone =
            document.getElementById(
                "phone"
            );


        const province =
            document.getElementById(
                "province"
            );


        const district =
            document.getElementById(
                "district"
            );


        const address =
            document.getElementById(
                "address"
            );


        const facebook =
            document.getElementById(
                "facebook"
            );


        const line =
            document.getElementById(
                "line"
            );


        const instagram =
            document.getElementById(
                "instagram"
            );


        const about =
            document.getElementById(
                "about"
            );


        const createdAt =
            document.getElementById(
                "createdAt"
            );


        const dogCount =
            document.getElementById(
                "dogCount"
            );


        const catCount =
            document.getElementById(
                "catCount"
            );


        const totalCount =
            document.getElementById(
                "totalCount"
            );


        const editBtn =
            document.getElementById(
                "editProfileBtn"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        /* =========================================
           แสดงข้อมูลหรือ -
        ========================================== */

        function displayValue(value) {

            if (
                value === undefined ||
                value === null ||
                String(value).trim() === ""
            ) {

                return "-";

            }


            return String(value);

        }


        /* =========================================
           Format วันที่
        ========================================== */

        function formatDate(value) {

            if (!value) {

                return "-";

            }


            try {

                let date;


                if (
                    typeof value.toDate ===
                    "function"
                ) {

                    date =
                        value.toDate();

                } else if (
                    value instanceof Date
                ) {

                    date =
                        value;

                } else {

                    date =
                        new Date(value);

                }


                if (
                    isNaN(
                        date.getTime()
                    )
                ) {

                    return "-";

                }


                return date.toLocaleDateString(
                    "th-TH",
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );


            } catch (error) {

                console.error(
                    "formatDate error:",
                    error
                );


                return "-";

            }

        }


        /* =========================================
           Facebook
        ========================================== */

        function createFacebookLink(
            value
        ) {

            if (
                !value ||
                value.trim() === ""
            ) {

                facebook.textContent =
                    "-";

                return;

            }


            let url =
                value.trim();


            if (
                !url.startsWith("http://") &&
                !url.startsWith("https://")
            ) {

                url =
                    "https://" + url;

            }


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";


            link.textContent =
                value;


            facebook.innerHTML =
                "";


            facebook.appendChild(
                link
            );

        }


        /* =========================================
           Instagram
        ========================================== */

        function createInstagramLink(
            value
        ) {

            if (
                !value ||
                value.trim() === ""
            ) {

                instagram.textContent =
                    "-";

                return;

            }


            let ig =
                value.trim();


            ig =
                ig.replace(
                    /^@/,
                    ""
                );


            if (
                ig.includes(
                    "instagram.com/"
                )
            ) {

                try {

                    const url =
                        new URL(
                            ig.startsWith("http")
                                ? ig
                                : "https://" + ig
                        );


                    ig =
                        url.pathname
                            .replace(
                                /^\/|\/$/g,
                                ""
                            );

                } catch (error) {

                    console.warn(
                        "Instagram URL ไม่ถูกต้อง"
                    );

                }

            }


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                "https://instagram.com/" +
                encodeURIComponent(ig);


            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";


            link.textContent =
                "@" + ig;


            instagram.innerHTML =
                "";


            instagram.appendChild(
                link
            );

        }


        /* =========================================
           Authentication
        ========================================== */

        onAuthStateChanged(
            auth,
            async (user) => {

                /* ===============================
                   ไม่ได้ Login
                =============================== */

                if (!user) {

                    location.href =
                        "login.html";

                    return;

                }


                try {


                    /* ===============================
                       UID
                    =============================== */

                    const uid =
                        profileUid ||
                        user.uid;


                    console.log(
                        "Login UID:",
                        user.uid
                    );


                    console.log(
                        "Profile UID:",
                        uid
                    );


                    /* ===============================
                       Edit Button

                       เจ้าของเท่านั้น
                    =============================== */

                    if (
                        uid === user.uid
                    ) {

                        editBtn.style.display =
                            "inline-flex";

                    } else {

                        editBtn.style.display =
                            "none";

                    }


                    /* ===============================
                       User Document
                    =============================== */

                    const userRef =
                        doc(
                            db,
                            "users",
                            uid
                        );


                    const userSnap =
                        await getDoc(
                            userRef
                        );


                    console.log(
                        "User exists:",
                        userSnap.exists()
                    );


                    if (
                        userSnap.exists()
                    ) {


                        const data =
                            userSnap.data();


                        console.log(
                            "User data:",
                            data
                        );


                        /* =========================
                           รูปโปรไฟล์
                        ========================== */

                        profileImage.src =
                            data.profile ||
                            "img/default-profile.png";


                        /* =========================
                           Username
                        ========================== */

                        const name =
                            displayValue(
                                data.username
                            );


                        profileName.textContent =
                            name === "-"
                                ? "User"
                                : name;


                        username.textContent =
                            name;


                        /* =========================
                           Email
                        ========================== */

                        const userEmail =
                            data.email ||
                            (
                                uid === user.uid
                                    ? user.email
                                    : ""
                            );


                        profileEmail.textContent =
                            displayValue(
                                userEmail
                            );


                        email.textContent =
                            displayValue(
                                userEmail
                            );


                        /* =========================
                           Phone
                        ========================== */

                        phone.textContent =
                            displayValue(
                                data.phone
                            );


                        /* =========================
                           Province
                        ========================== */

                        province.textContent =
                            displayValue(
                                data.province
                            );


                        /* =========================
                           District
                        ========================== */

                        district.textContent =
                            displayValue(
                                data.district
                            );


                        /* =========================
                           Address
                        ========================== */

                        address.textContent =
                            displayValue(
                                data.address
                            );


                        /* =========================
                           Facebook
                        ========================== */

                        createFacebookLink(
                            data.facebook
                        );


                        /* =========================
                           Line
                        ========================== */

                        line.textContent =
                            displayValue(
                                data.line
                            );


                        /* =========================
                           Instagram
                        ========================== */

                        createInstagramLink(
                            data.instagram
                        );


                        /* =========================
                           About
                        ========================== */

                        about.textContent =
                            displayValue(
                                data.about
                            );


                        /* =========================
                           วันที่สมัคร
                        ========================== */

                        createdAt.textContent =
                            formatDate(
                                data.createdAt
                            );


                    } else {


                        /*
                         * ถ้าไม่พบ users/{uid}
                         */

                        profileImage.src =
                            "img/default-profile.png";


                        profileName.textContent =
                            "User";


                        profileEmail.textContent =
                            "-";


                        username.textContent =
                            "-";


                        email.textContent =
                            "-";


                        phone.textContent =
                            "-";


                        province.textContent =
                            "-";


                        district.textContent =
                            "-";


                        address.textContent =
                            "-";


                        facebook.textContent =
                            "-";


                        line.textContent =
                            "-";


                        instagram.textContent =
                            "-";


                        about.textContent =
                            "-";


                        /*
                         * ถ้าเป็นเจ้าของตัวเอง
                         * ใช้วันที่สร้าง Firebase Account
                         */

                        if (
                            uid === user.uid &&
                            user.metadata.creationTime
                        ) {

                            createdAt.textContent =
                                formatDate(
                                    user.metadata
                                        .creationTime
                                );

                        } else {

                            createdAt.textContent =
                                "-";

                        }

                    }


                    /* =====================================
                       นับจำนวนสุนัข
                    ====================================== */

                    let dogTotal =
                        0;


                    const dogsSnapshot =
                        await getDocs(
                            collection(
                                db,
                                "dogs"
                            )
                        );


                    dogsSnapshot.forEach(
                        (petDoc) => {

                            const pet =
                                petDoc.data();


                            if (
                                pet.ownerUid ===
                                uid
                            ) {

                                dogTotal++;

                            }

                        }
                    );


                    /* =====================================
                       นับจำนวนแมว
                    ====================================== */

                    let catTotal =
                        0;


                    const catsSnapshot =
                        await getDocs(
                            collection(
                                db,
                                "cats"
                            )
                        );


                    catsSnapshot.forEach(
                        (petDoc) => {

                            const pet =
                                petDoc.data();


                            if (
                                pet.ownerUid ===
                                uid
                            ) {

                                catTotal++;

                            }

                        }
                    );


                    /* =====================================
                       แสดงจำนวน
                    ====================================== */

                    dogCount.textContent =
                        dogTotal;


                    catCount.textContent =
                        catTotal;


                    totalCount.textContent =
                        dogTotal +
                        catTotal;


                } catch (error) {


                    console.error(
                        "Profile error:",
                        error
                    );


                    alert(
                        "ไม่สามารถโหลดข้อมูลโปรไฟล์ได้\n\n" +
                        "Code: " +
                        (
                            error.code ||
                            "unknown"
                        ) +
                        "\n\nMessage: " +
                        error.message
                    );


                } finally {


                    /* ===============================
                       ปิด Loading
                    =============================== */

                    loading.classList.add(
                        "hidden"
                    );

                }

            }
        );

    </script>

</body>

</html>
