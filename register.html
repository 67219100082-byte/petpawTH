<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน | PetPaw</title>
</head>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffffff;
}

.register-box{
    position:relative;
    width:400px;
    padding:40px;
    border-radius:25px;
    background:white;
    border:1px solid #eee;
    box-shadow:0 5px 25px rgba(0,0,0,0.12);
}

.close-btn{
    position:absolute;
    top:15px;
    right:20px;
    font-size:28px;
    text-decoration:none;
    color:#999;
    font-weight:bold;
    transition:.3s;
}

.close-btn:hover{
    color:#c8a77c;
    transform:rotate(90deg);
}

.register-box h1{
    text-align:center;
    color:#444;
    margin-bottom:25px;
    font-size:35px;
}

.profile-preview{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:0 auto 20px;
    border:3px solid #ddd;
}

.input-box{
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:16px;
    background:#f7f7f7;
}

.input-box input:focus{
    border:1px solid #c8a77c;
    background:white;
}

.register-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#c8a77c;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.register-btn:hover{
    transform:translateY(-4px);
    background:#b89268;
}

.login-link{
    text-align:center;
    margin-top:20px;
    color:#666;
}
.profile-upload {
    text-align: center;
    margin-bottom: 20px;
}

.profile-upload label {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
}

.profile-preview {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #ddd;
    margin: 0 auto 10px;
    transition: .2s;
}

.profile-preview:hover {
    transform: scale(1.05);
    border-color: #c8a77c;
}

.upload-text {
    color: #c8a77c;
    font-weight: bold;
    font-size: 15px;
}

/* ซ่อน input file ตัวจริง */
#profile {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
}

.login-link a{
    color:#c8a77c;
    font-weight:bold;
    text-decoration:none;
}

@media(max-width:768px){

    .register-box{
        width:90%;
        padding:30px 20px;
    }

}

</style>

</head>

<body>

<div class="register-box">

<a href="index.html" class="close-btn">×</a>

<h1>ลงทะเบียน</h1>

<form id="registerForm">

    <div class="input-box">
        <input
            type="text"
            id="username"
            placeholder="Username"
            required>
    </div>

    <div class="input-box">
        <input
            type="email"
            id="email"
            placeholder="Email"
            required>
    </div>

    <div class="input-box">
        <input
            type="password"
            id="password"
            minlength="6"
            placeholder="Password อย่างน้อย 6 ตัว"
            required>
    </div>

    <!-- รูปโปรไฟล์ -->
    <div class="profile-upload">

        <label for="profile">

            <img
                id="profilePreview"
                class="profile-preview"
                src="img/default-profile.png"
            >

            <div class="upload-text">
                เลือกรูปโปรไฟล์
            </div>

        </label>

        <input
            type="file"
            id="profile"
            accept="image/*"
        >

    </div>

    <button
        type="submit"
        class="register-btn"
        id="registerButton">
        ลงทะเบียน
    </button>

</form>

<div class="login-link">
    มีบัญชีแล้ว?
    <a href="login.html">เข้าสู่ระบบ</a>
</div>
</div>
<script>
    const profileInput = document.getElementById("profile");
const profilePreview = document.getElementById("profilePreview");


// ===============================
// แสดงตัวอย่างรูปโปรไฟล์
// ===============================

profileInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;


    // ตรวจสอบว่าเป็นรูปภาพ
    if (!file.type.startsWith("image/")) {

        alert("กรุณาเลือกไฟล์รูปภาพ");

        this.value = "";

        return;
    }


    // จำกัดขนาดไม่เกิน 5 MB
    if (file.size > 5 * 1024 * 1024) {

        alert("รูปภาพต้องมีขนาดไม่เกิน 5 MB");

        this.value = "";

        return;
    }


    // แสดง Preview
    const reader = new FileReader();

    reader.onload = function (e) {

        profilePreview.src = e.target.result;

    };

    reader.readAsDataURL(file);

});


// ===============================
// สมัครสมาชิก
// ===============================

document
    .getElementById("registerForm")
    .addEventListener("submit", async function (e) {

        e.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const registerButton =
            document.getElementById("registerButton");


        const profileFile =
            profileInput.files[0];


        try {

            // ป้องกันกดปุ่มซ้ำ
            registerButton.disabled = true;
            registerButton.textContent = "กำลังสมัคร...";


            // ===============================
            // 1. สร้างบัญชี Firebase Authentication
            // ===============================

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            // ===============================
            // 2. รูปโปรไฟล์เริ่มต้น
            // ===============================

            let profileURL =
                "img/default-profile.png";


            // ===============================
            // 3. ถ้ามีการเลือกรูป
            // ===============================

            if (profileFile) {

                const extension =
                    profileFile.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                // ที่อยู่ไฟล์ใน Firebase Storage
                const storageRef =
                    ref(
                        storage,
                        `profile/${user.uid}.${extension}`
                    );


                // Upload รูป
                await uploadBytes(
                    storageRef,
                    profileFile
                );


                // เอา URL รูป
                profileURL =
                    await getDownloadURL(
                        storageRef
                    );
            }


            // ===============================
            // 4. บันทึกข้อมูลลง Firestore
            // ===============================

            await setDoc(
                doc(db, "users", user.uid),
                {

                    username: username,

                    email: email,

                    profile: profileURL,

                    role: "user",

                    createdAt: serverTimestamp()

                }
            );


            // ===============================
            // 5. สมัครสำเร็จ
            // ===============================

            alert("สมัครสมาชิกสำเร็จ");

            window.location.href =
                "index.html";


        } catch (error) {

            console.error(
                "Register Error:",
                error
            );


            // ===============================
            // แสดง Error
            // ===============================

            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                alert(
                    "อีเมลนี้ถูกใช้งานแล้ว"
                );

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                alert(
                    "รหัสผ่านต้องมีอย่างน้อย 6 ตัว"
                );

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                alert(
                    "รูปแบบอีเมลไม่ถูกต้อง"
                );

            }

            else if (
                error.code ===
                "storage/unauthorized"
            ) {

                alert(
                    "ไม่มีสิทธิ์อัปโหลดรูป กรุณาตรวจสอบ Storage Rules"
                );

            }

            else {

                alert(
                    "สมัครสมาชิกไม่สำเร็จ\n" +
                    error.message
                );

            }


            // เปิดปุ่มกลับมาใช้ใหม่
            registerButton.disabled = false;

            registerButton.textContent =
                "ลงทะเบียน";

        }

    });
</script>
<script type="module">
    
import { auth, db, storage } from "./firebase.js";

import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";


/* สมัคร */
document.getElementById("registerForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    await setDoc(doc(db, "users", user.uid), {
        username: username,
        email: email,
        profile: profileImage,
        role: "user",
        createdAt: new Date()
    });

    alert("สมัครสำเร็จ");
    window.location.href = "index.html";

} catch (error) {

    if (error.code === "auth/email-already-in-use") {
        alert("อีเมลนี้ถูกใช้งานแล้ว");
    }
    else if (error.code === "auth/weak-password") {
        alert("รหัสผ่านต้องมีอย่างน้อย 6 ตัว");
    }
    else if (error.code === "auth/invalid-email") {
        alert("รูปแบบอีเมลไม่ถูกต้อง");
    }
    else {
        alert(error.message);
    }

    console.log(error);
}
});
	
</script>
</body>
</html>
