/* =========================
   Full Image Viewer
========================= */

.image-viewer{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.88);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px;

    opacity:0;
    visibility:hidden;

    transition:.3s;

    z-index:999999;
}

.image-viewer.show{
    opacity:1;
    visibility:visible;
}

.image-viewer img{
    max-width:95vw;
    max-height:90vh;

    width:auto;
    height:auto;

    object-fit:contain;

    border-radius:15px;

    box-shadow:0 10px 40px rgba(0,0,0,.5);

    transform:scale(.9);
    transition:.3s;
}

.image-viewer.show img{
    transform:scale(1);
}

.image-viewer-close{
    position:absolute;

    top:20px;
    right:25px;

    width:50px;
    height:50px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.15);
    color:white;

    font-size:30px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;

    z-index:2;
}

.image-viewer-close:hover{
    background:rgba(255,255,255,.3);
    transform:scale(1.08);
}

/* รูปสุนัขสามารถกดดูได้ */

.dog-image:hover{

}

	color:#796247;

	transition:0.3s;

	display:flex;
	align-items:center;
	justify-content:center;
}

.menu-btn:hover{
	transform:translateY(-5px);

	background:rgba(255,255,255,0.3);

	box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* =========================
   Dropdown
========================= */

.dropdown{
	position:absolute;

	top:70px;
	left:0;

	background:white;

	border-radius:18px;

	min-width:220px;

	padding:10px 0;

	box-shadow:0 5px 20px rgba(0,0,0,0.15);

	opacity:0;
	visibility:hidden;

	transform:translateY(10px);

	transition:0.25s;

	z-index:99999;
}

/* ทำพื้นที่กัน dropdown หาย */

.menu-item::after{
	content:"";
	position:absolute;
	left:0;
	top:55px;
	width:100%;
	height:25px;
}

/* ลิงก์ */

.dropdown a{
	display:block;

	padding:18px 22px;

	color:#444;

	font-weight:bold;

	transition:0.3s;
}

/* Hover */

.dropdown a:hover{
	background:#f2e4d3;
}

/* แสดง dropdown */

.menu-item:hover .dropdown{
	opacity:1;
	visibility:visible;
	transform:translateY(0);
}

<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
    doc,
    getDoc,
    collection,
    getDocs,
    query,
    where,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const userMenu = document.getElementById("userMenu");
const sidebarUserMenu = document.getElementById("sidebarUserMenu");

const dogContainer = document.getElementById("dogContainer");

let allDogs = [];

let currentUser = null;

let isAdmin = false;

const params = new URLSearchParams(window.location.search);

const dogId = params.get("id");

const districtFilter = document.getElementById("districtFilter");
districtFilter.addEventListener("change", () => {

    const district = districtFilter.value;

    if (district === "ทั้งหมด") {

        renderDogs(allDogs);

    } else {

        const filteredDogs = allDogs.filter(dog => dog.district === district);

        renderDogs(filteredDogs);

    }

});


async function loadDogs(){

    const snapshot = await getDocs(
        collection(db,"dogs")
    );

    allDogs = [];

    snapshot.forEach(doc => {

    allDogs.push({

        id: doc.id,
        ...doc.data()

    });

});


/* =========================================
   เรียงโพสต์
   1. เพิ่มล่าสุดอยู่ด้านบน
   2. ได้บ้านแล้วอยู่ด้านล่าง
========================================= */

allDogs.sort((a, b) => {

    // สถานะได้บ้านแล้ว
    const aAdopted =
        a.adoptionStatus === "ได้บ้านแล้ว";

    const bAdopted =
        b.adoptionStatus === "ได้บ้านแล้ว";


    // ถ้าสถานะต่างกัน
    // ให้ "ได้บ้านแล้ว" ไปอยู่ด้านล่าง
    if (aAdopted && !bAdopted) {
        return 1;
    }

    if (!aAdopted && bAdopted) {
        return -1;
    }


    // ถ้าสถานะเหมือนกัน
    // เรียงจากวันที่เพิ่มล่าสุด -> เก่าสุด
    const aTime =
        a.createdAt?.toMillis
            ? a.createdAt.toMillis()
            : new Date(a.createdAt || 0).getTime();

    const bTime =
        b.createdAt?.toMillis
            ? b.createdAt.toMillis()
            : new Date(b.createdAt || 0).getTime();


    return bTime - aTime;

});

   console.log(allDogs);

if(dogId){

    const dog = allDogs.filter(item => item.id === dogId);

    renderDogs(dog);

}else{

    renderDogs(allDogs);

}

}

        return;

    }

    data.forEach(dog=>{

        dogContainer.innerHTML += `

<div class="dog-card">

<img
    src="${dog.image}"
    class="dog-image"
    onclick="openImageViewer('${dog.image}')"
    alt="${dog.name || 'รูปสุนัข'}">

<div class="dog-content">

<div class="dog-header">

    <div class="dog-name">
        <span class="info-label">เพศ</span>
        <span class="info-value">: ${dog.gender}</span>
    </div>

    <div class="header-right">

        <div class="adoption-status ${
    dog.adoptionStatus === "ได้บ้านแล้ว"
        ? "adopted"
        : "available"
}">
    ${dog.adoptionStatus || dog.status}
</div>

    </div>

</div>
<div class="info-grid">

    <div class="info-item">
        <span class="info-label">ชื่อ</span>
        <span class="info-value">: ${dog.name}</span>
    </div>

    <div class="info-item">
        <span class="info-label">อายุ</span>
        <span class="info-value">: ${dog.age}</span>
    </div>

    <div class="info-item">
        <span class="info-label">สายพันธุ์</span>
        <span class="info-value">: ${dog.breed}</span>
    </div>

    <div class="info-item">
        <span class="info-label">ขนาด</span>
        <span class="info-value">: ${dog.size}</span>
    </div>


    <div class="info-item">
        <span class="info-label">วัคซีน</span>
        <span class="info-value">: ${dog.vaccine}</span>
    </div>

    <div class="info-item">
        <span class="info-label">ทำหมัน</span>
        <span class="info-value">: ${dog.sterilized}</span>
    </div>
    <div class="info-item">
        <span class="info-label">จังหวัด</span>
        <span class="info-value">: ${dog.province}</span>
    </div>
    <div class="info-item">
        <span class="info-label">อำเภอ</span>
        <span class="info-value">: ${dog.district}</span>
    </div>
    <div class="info-item">
        <span class="info-label">ตำบล</span>
        <span class="info-value">: ${dog.subdistrict}</span>
    </div>

</div>
<div class="section-title">
รายละเอียด
</div>

<div class="detail">
${dog.detail}
</div>

<hr class="section-divider">

<a href="profile.html?uid=${dog.ownerUid}" class="owner-box">

    <div class="owner-profile">

        <img src="${dog.ownerProfile || 'img/default-profile.png'}">

        <div class="owner-name">
            ${dog.ownerName}
        </div>

    </div>

    <div class="contact">
        <p>📞 ${dog.phone || "-"}</p>
        <p>Facebook : ${dog.facebook || "-"}</p>
    </div>

</a>

${currentUser && (currentUser.uid === dog.ownerUid || isAdmin) ? `

<div class="owner-actions">

    <button
        class="status-btn"
        onclick="changeStatus('${dog.id}')">

        เปลี่ยนสถานะ

    </button>

    <button
        class="delete-btn"
        onclick="deleteDog('${dog.id}')">

        ลบโพสต์

</button>

</div>

` : ""}

</div>   

</div>  

</div>   


`;

    });

}

// =============================
// เปลี่ยนสถานะ
// =============================
window.changeStatus = async function(id){

    const status = prompt(
`เลือกสถานะ

กำลังหาบ้าน
ได้บ้านแล้ว`
    );

    if(!status) return;

    await updateDoc(
        doc(db,"dogs",id),
        {
            adoptionStatus: status
        }
    );

    alert("อัปเดตสถานะเรียบร้อย");

    loadDogs();

};

// =============================
// ลบโพสต์
// =============================
window.deleteDog = async function(id){

    const dog = allDogs.find(item => item.id === id);

    if(!dog){
        return;
    }

    if(currentUser.uid !== dog.ownerUid && !isAdmin){
        alert("คุณไม่มีสิทธิ์ลบโพสต์นี้");
        return;
    }

    const ok = confirm("ต้องการลบโพสต์นี้หรือไม่");

    if(!ok) return;

    await deleteDoc(doc(db,"dogs",id));

    alert("ลบโพสต์เรียบร้อย");

    loadDogs();

};  


onAuthStateChanged(auth, async (user) => {
    currentUser = user;
console.log("Auth =", user);
    if (user) {

        const snap = await getDoc(doc(db, "users", user.uid));

        let username = "User";
        let photo = "img/default-profile.png";

        if (snap.exists()) {
            username = snap.data().username || "User";
            photo = snap.data().profile || "img/default-profile.png";
            isAdmin = snap.data().role === "admin";
        }

        // ---------- Desktop ----------
        userMenu.innerHTML = `
            <div class="user-dropdown">

                <div class="user-profile" id="profileBtn">

                    <img src="${photo}">
                    <span>${username}</span>

                    <a href="#" id="logoutBtn">ออกจากระบบ</a>

                </div>

            </div>
        `;

        // ---------- Mobile Sidebar ---------- 
sidebarUserMenu.className = "";
sidebarUserMenu.innerHTML = `
<div class="sidebar-user">

    <div>

        <div class="sidebar-name">
            ${username}
        </div>

        <a href="profile.html">

        </a>

        <br>

        <a href="#" id="sidebarLogout">
            ออกจากระบบ
        </a>

    </div>

</div>
`;


        // Desktop Dropdown
        document.getElementById("profileBtn").onclick = () => {

            document
                .getElementById("dropdownMenu")
                .classList.toggle("show");

        };

        // Desktop Logout
        document.getElementById("logoutBtn").onclick = async () => {

            await signOut(auth);

        };

        // Mobile Logout
        document.getElementById("sidebarLogout").onclick = async () => {

    await signOut(auth);
    location.reload();

};

    }

    else {

        userMenu.innerHTML = `

        <a href="register.html" class="menu-btn">
            ลงทะเบียน
        </a>

        <a href="login.html" class="menu-btn">
            เข้าสู่ระบบ
        </a>

        `;

        sidebarUserMenu.className = "sidebar-buttons";

sidebarUserMenu.innerHTML = `
<a href="register.html" class="register-btn">
    ลงทะเบียน
</a>

<a href="login.html" class="login-btn">
    เข้าสู่ระบบ
</a>
`;

    }

    await loadDogs();

});
const chatBtn = document.getElementById("chatBtn");
const chatPopup = document.getElementById("chatPopup");
const closeChat = document.getElementById("closeChat");

const isMobile = () => window.innerWidth <= 768;

chatBtn.onclick = () => {

    if(isMobile()){

        chatPopup.classList.add("show");

};

const imageViewer = document.getElementById("imageViewer");
const fullImage = document.getElementById("fullImage");
const imageViewerClose = document.getElementById("imageViewerClose");

window.openImageViewer = function(imageUrl){

    fullImage.src = imageUrl;

    imageViewer.classList.add("show");

    // ป้องกันหน้าเว็บด้านหลังเลื่อน
    document.body.classList.add("no-scroll");
};


// =========================
// ปิดรูป
// =========================

function closeImageViewer(){

    imageViewer.classList.remove("show");

    document.body.classList.remove("no-scroll");

    setTimeout(() => {
        fullImage.src = "";
    }, 300);
}


// ปุ่ม X
imageViewerClose.addEventListener("click", function(){

    closeImageViewer();

});


// คลิกพื้นหลัง
imageViewer.addEventListener("click", function(e){

    if(e.target === imageViewer){

        closeImageViewer();

    }

});


// กด ESC
document.addEventListener("keydown", function(e){

    if(e.key === "Escape"){

        closeImageViewer();

    }

});
