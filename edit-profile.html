<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>แก้ไขโปรไฟล์ | PetPaw</title>

    <!-- Google Font : Prompt -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Prompt", sans-serif;
            background: #f8f4ee;
            color: #182338;
            min-height: 100vh;
        }

        /* =========================
           Navbar
        ========================= */

        .navbar {
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;

            background: #ffffff;

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.08);

            position: sticky;
            top: 0;

            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #796247;
            text-decoration: none;
        }

        .home-link {
            text-decoration: none;
            color: #796247;

            font-size: 16px;
            font-weight: 500;

            padding: 10px 20px;

            border-radius: 12px;

            transition: 0.25s;
        }

        .home-link:hover {
    background: #8a6847;
    color: #ffffff;
}

        /* =========================
           Main
        ========================= */

        .container {
            width: min(1100px, calc(100% - 40px));
            margin: 45px auto 60px;
        }

        /* =========================
           Profile Top
        ========================= */

        .profile-top {
            display: flex;
            align-items: center;
            gap: 30px;

            background: #ffffff;

            padding: 30px;

            border-radius: 25px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.07);

            margin-bottom: 25px;
        }

        .photo-box {
            width: 150px;
            flex-shrink: 0;

            text-align: center;
        }

        #profileImage {
            width: 130px;
            height: 130px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            margin: auto;

            border: 5px solid #eef2ff;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.12);
        }

        .change-photo {
            display: inline-block;

            margin-top: 12px;

            padding: 8px 14px;

            border-radius: 10px;

            background: #c8a77c;
    color: white;

            font-size: 13px;
            font-weight: 500;

            cursor: pointer;

            transition: 0.25s;
        }

        .change-photo:hover {
            background: #8a6847;
            color: #ffffff;
        }

        #imageInput {
            display: none;
        }

        .profile-info h1 {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .profile-info p {
            color: #777;
            font-size: 15px;
        }

        /* =========================
           Edit Card
        ========================= */

        .edit-card {
            background: #ffffff;

            padding: 35px;

            border-radius: 25px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.07);
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;

            margin-bottom: 25px;

            color: #182338;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 500;

            color: #444;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;

            border: 1px solid #dfe3eb;

            background: #ffffff;

            border-radius: 12px;

            padding: 13px 15px;

            font-family: "Prompt", sans-serif;

            font-size: 14px;

            color: #182338;

            outline: none;

            transition: 0.25s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            border-color: #c8a77c;

            box-shadow:
                0 0 0 3px rgba(200, 167, 124, 0.18);
        }

        .form-group input[readonly] {
            background: #f3f4f6;
            color: #777;
            cursor: not-allowed;    
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        /* =========================
           Buttons
        ========================= */

        .button-group {
            display: flex;
            justify-content: flex-end;

            gap: 12px;

            margin-top: 30px;
        }

        .save-btn,
        .cancel-btn {

            border: none;

            border-radius: 12px;

            padding: 12px 25px;

            font-family: "Prompt", sans-serif;

            font-size: 15px;

            cursor: pointer;

            text-decoration: none;

            transition: 0.25s;
        }

        .save-btn {
    background: #8a6847;
    color: white;
}

.save-btn:hover {
    background: #796247;
}

        .save-btn:disabled {
            background: #a5a5a5;
            cursor: not-allowed;
        }

        .cancel-btn {
    color: #8a6847;
    border: 1px solid #c8a77c;
    background: white;
}

.cancel-btn:hover {
    background: #f8f4ee;
}

        /* =========================
           Loading
        ========================= */

        .loading {
            position: fixed;

            inset: 0;

            background: rgba(255, 255, 255, 0.85);

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 9999;

            font-size: 18px;

            color: #8a6847;
        }

        .loading.hidden {
            display: none;
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 768px) {

            .navbar {
                padding: 0 20px;
            }

            .container {
                width: calc(100% - 24px);

                margin-top: 20px;
            }

            .profile-top {
                flex-direction: column;

                text-align: center;

                padding: 25px 20px;

                gap: 15px;
            }

            .photo-box {
                width: 100%;
            }

            .profile-info h1 {
                font-size: 25px;
            }

            .edit-card {
                padding: 25px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .button-group {
                flex-direction: column;
            }

            .save-btn,
            .cancel-btn {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>


<body>

    <!-- =========================
         Navbar
    ========================= -->

    <nav class="navbar">

        <a
            href="index.html"
            class="logo">

            PetPaw

        </a>

        <a
            href="index.html"
            class="home-link">

            HOME

        </a>

    </nav>


    <!-- Loading -->

    <div
        id="loading"
        class="loading">

        กำลังโหลดข้อมูล...

    </div>


    <!-- =========================
         Main
    ========================= -->

    <main class="container">


        <!-- Profile Top -->

        <div class="profile-top">


            <!-- รูปโปรไฟล์ -->

            <div class="photo-box">

                <img
                    id="profileImage"
                    src="img/default-profile.png"
                    alt="Profile">

                <label
                    for="imageInput"
                    class="change-photo">

                    เปลี่ยนรูปโปรไฟล์

                </label>

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*">

            </div>


            <!-- ข้อมูล -->

            <div class="profile-info">

                <h1>

                    แก้ไขโปรไฟล์

                </h1>

                <p>

                    แก้ไขข้อมูลบัญชีผู้ใช้

                </p>

            </div>

        </div>


        <!-- =========================
             Edit Card
        ========================= -->

        <div class="edit-card">


            <div class="card-title">

                ข้อมูลส่วนตัว

            </div>


            <div class="form-grid">


                <!-- Username -->

                <div class="form-group">

                    <label for="username">

                        Username

                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="กรอก Username">

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">

                        Email

                    </label>

                    <input
                        type="email"
                        id="email"
                        readonly>

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">

                        เบอร์โทร

                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="กรอกเบอร์โทร">

                </div>


                <!-- Province -->

                <div class="form-group">

                    <label for="province">

                        จังหวัด

                    </label>

                    <select id="province">

                        <option value="">

                            -- เลือกจังหวัด --

                        </option>

                        <option value="พัทลุง">

                            พัทลุง

                        </option>

                    </select>

                </div>


                <!-- District -->

                <div class="form-group">

                    <label for="district">

                        อำเภอ

                    </label>

                    <select id="district">

                        <option value="">

                            -- เลือกอำเภอ --

                        </option>

                        <option value="เมืองพัทลุง">

                            เมืองพัทลุง

                        </option>

                        <option value="กงหรา">

                            กงหรา

                        </option>

                        <option value="เขาชัยสน">

                            เขาชัยสน

                        </option>

                        <option value="ตะโหมด">

                            ตะโหมด

                        </option>

                        <option value="ควนขนุน">

                            ควนขนุน

                        </option>

                        <option value="ปากพะยูน">

                            ปากพะยูน

                        </option>

                        <option value="ป่าบอน">

                            ป่าบอน

                        </option>

                        <option value="ศรีบรรพต">

                            ศรีบรรพต

                        </option>

                        <option value="ศรีนครินทร์">

                            ศรีนครินทร์

                        </option>

                        <option value="บางแก้ว">

                            บางแก้ว

                        </option>

                        <option value="ป่าพะยอม">

                            ป่าพะยอม

                        </option>

                    </select>

                </div>


                <!-- Address -->

                <div class="form-group full-width">

                    <label for="address">

                        ที่อยู่

                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="กรอกที่อยู่">

                </div>


                <!-- Facebook -->

                <div class="form-group">

                    <label for="facebook">

                        Facebook

                    </label>

                    <input
                        type="text"
                        id="facebook"
                        placeholder="Facebook">

                </div>


                <!-- Line -->

                <div class="form-group">

                    <label for="line">

                        Line ID

                    </label>

                    <input
                        type="text"
                        id="line"
                        placeholder="Line ID">

                </div>


                <!-- Instagram -->

                <div class="form-group">

                    <label for="instagram">

                        Instagram

                    </label>

                    <input
                        type="text"
                        id="instagram"
                        placeholder="Instagram">

                </div>


                <!-- About -->

                <div class="form-group full-width">

                    <label for="about">

                        เกี่ยวกับฉัน

                    </label>

                    <textarea
                        id="about"
                        placeholder="แนะนำตัวเกี่ยวกับคุณ"></textarea>

                </div>


            </div>


            <!-- Buttons -->

            <div class="button-group">

                <button
                    type="button"
                    class="save-btn"
                    id="saveBtn">

                    บันทึกข้อมูล

                </button>

                <a
                    href="profile.html"
                    class="cancel-btn">

                    ยกเลิก

                </a>

            </div>


        </div>

    </main>


    <!-- =========================
         JavaScript
    ========================= -->

    <script type="module">

        import {
            auth,
            db
        } from "./firebase.js";


        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";


        import {
            doc,
            getDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


        // ============================
        // ตัวแปร
        // ============================

        const profileImage =
            document.getElementById("profileImage");

        const imageInput =
            document.getElementById("imageInput");

        const username =
            document.getElementById("username");

        const email =
            document.getElementById("email");

        const phone =
            document.getElementById("phone");

        const province =
            document.getElementById("province");

        const district =
            document.getElementById("district");

        const address =
            document.getElementById("address");

        const facebook =
            document.getElementById("facebook");

        const line =
            document.getElementById("line");

        const instagram =
            document.getElementById("instagram");

        const about =
            document.getElementById("about");

        const saveBtn =
            document.getElementById("saveBtn");

        const loading =
            document.getElementById("loading");


        let currentUser = null;

        let selectedFile = null;

        // รูปเดิมจาก Firestore

        let currentPhoto =
            "img/default-profile.png";


        // ============================
        // โหลดข้อมูลผู้ใช้
        // ============================

        onAuthStateChanged(
            auth,
            async (user) => {

                console.log("user =", user);


                // ยังไม่ได้ Login

                if (!user) {

                    alert("กรุณาเข้าสู่ระบบ");

                    location.href = "login.html";

                    return;

                }


                currentUser = user;


                console.log(
                    "UID =",
                    user.uid
                );


                try {

                    const userRef =
                        doc(
                            db,
                            "users",
                            user.uid
                        );


                    const snap =
                        await getDoc(userRef);


                    console.log(
                        "exists =",
                        snap.exists()
                    );


                    if (snap.exists()) {

                        const data =
                            snap.data();


                        console.log(
                            "User data =",
                            data
                        );


                        // =========================
                        // ใส่ข้อมูลลง Form
                        // =========================

                        username.value =
                            data.username || "";


                        email.value =
                            data.email ||
                            user.email ||
                            "";


                        phone.value =
                            data.phone || "";


                        province.value =
                            data.province || "";


                        district.value =
                            data.district || "";


                        address.value =
                            data.address || "";


                        facebook.value =
                            data.facebook || "";


                        line.value =
                            data.line || "";


                        instagram.value =
                            data.instagram || "";


                        about.value =
                            data.about || "";


                        // =========================
                        // รูปโปรไฟล์
                        // =========================

                        currentPhoto =
                            data.profile ||
                            "img/default-profile.png";


                        profileImage.src =
                            currentPhoto;

                    } else {

                        // ถ้าไม่มี Document

                        email.value =
                            user.email || "";


                        currentPhoto =
                            "img/default-profile.png";


                        profileImage.src =
                            currentPhoto;


                        console.warn(
                            "ไม่พบข้อมูล users/" +
                            user.uid
                        );

                    }


                } catch (error) {

                    console.error(
                        "โหลดข้อมูลไม่สำเร็จ:",
                        error
                    );


                    alert(
                        "ไม่สามารถโหลดข้อมูลโปรไฟล์ได้\n\n" +
                        error.message
                    );

                } finally {

                    loading.classList.add(
                        "hidden"
                    );

                }

            }
        );


        // ============================
        // Preview รูปที่เลือก
        // ============================

        imageInput.addEventListener(
            "change",
            (event) => {

                const file =
                    event.target.files[0];


                if (!file) {

                    return;

                }


                // ตรวจสอบประเภทไฟล์

                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {

                    alert(
                        "กรุณาเลือกไฟล์รูปภาพ"
                    );

                    imageInput.value = "";

                    return;

                }


                // จำกัดขนาด 2 MB

                if (
                    file.size >
                    2 * 1024 * 1024
                ) {

                    alert(
                        "รูปโปรไฟล์ต้องมีขนาดไม่เกิน 2 MB"
                    );

                    imageInput.value = "";

                    return;

                }


                selectedFile =
                    file;


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        profileImage.src =
                            event.target.result;

                    };


                reader.readAsDataURL(file);

            }
        );


        // ============================
        // แปลงรูปเป็น Base64
        // ============================

        function imageToBase64(file) {

            return new Promise(
                (resolve, reject) => {


                    // ไม่มีการเลือกรูปใหม่

                    if (!file) {

                        resolve(
                            currentPhoto
                        );

                        return;

                    }


                    const reader =
                        new FileReader();


                    reader.onload =
                        function () {

                            resolve(
                                reader.result
                            );

                        };


                    reader.onerror =
                        function () {

                            reject(
                                new Error(
                                    "อ่านรูปไม่สำเร็จ"
                                )
                            );

                        };


                    reader.readAsDataURL(
                        file
                    );

                }
            );

        }


        // ============================
        // บันทึกข้อมูล
        // ============================

        saveBtn.addEventListener(
            "click",
            async () => {

                // ป้องกันกรณี User ยังโหลดไม่เสร็จ

                if (!currentUser) {

                    alert(
                        "กรุณารอสักครู่ แล้วลองใหม่อีกครั้ง"
                    );

                    return;

                }


                try {

                    // =========================
                    // ป้องกันกดซ้ำ
                    // =========================

                    saveBtn.disabled =
                        true;

                    saveBtn.innerHTML =
                        "กำลังบันทึก...";


                    // =========================
                    // ตรวจสอบ Username
                    // =========================

                    if (
                        username.value.trim() === ""
                    ) {

                        alert(
                            "กรุณากรอก Username"
                        );

                        username.focus();

                        saveBtn.disabled =
                            false;

                        saveBtn.innerHTML =
                            "บันทึกข้อมูล";

                        return;

                    }


                    // =========================
                    // แปลงรูป
                    // =========================

                    const photoURL =
                        await imageToBase64(
                            selectedFile
                        );


                    // =========================
                    // Reference
                    // =========================

                    const userRef =
                        doc(
                            db,
                            "users",
                            currentUser.uid
                        );


                    // =========================
                    // Update Firestore
                    // =========================

                    await updateDoc(
                        userRef,
                        {

                            username:
                                username.value.trim(),

                            phone:
                                phone.value.trim(),

                            province:
                                province.value.trim(),

                            district:
                                district.value.trim(),

                            address:
                                address.value.trim(),

                            facebook:
                                facebook.value.trim(),

                            line:
                                line.value.trim(),

                            instagram:
                                instagram.value.trim(),

                            about:
                                about.value.trim(),

                            profile:
                                photoURL

                        }
                    );


                    // =========================
                    // สำเร็จ
                    // =========================

                    alert(
                        "บันทึกข้อมูลเรียบร้อยแล้ว"
                    );


                    location.href =
                        "profile.html";


                } catch (error) {

                    console.error(
                        "บันทึกข้อมูลไม่สำเร็จ:",
                        error
                    );


                    alert(
                        "บันทึกข้อมูลไม่สำเร็จ\n\n" +
                        "Code: " +
                        (error.code || "unknown") +
                        "\n\nMessage: " +
                        error.message
                    );


                    saveBtn.disabled =
                        false;

                    saveBtn.innerHTML =
                        "บันทึกข้อมูล";

                }

            }
        );

    </script>

</body>

</html>
